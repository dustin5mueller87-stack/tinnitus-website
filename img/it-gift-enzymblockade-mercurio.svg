  <g text-anchor="middle">
    <text class="title" x="336" y="63">PANORAMICA: LA CATENA RESPIRATORIA</text>
    <text class="subtitle" x="340" y="88">Produzione di energia nella cellula</text>
    <text class="title" x="956" y="63" font-size="20">ZOOM: INIBIZIONE ENZIMATICA DA MERCURIO</text>
    <text class="subtitle" x="966" y="88">Il mercurio si lega all'enzima e lo blocca</text>
  </g>

  <text class="label blue" x="31" y="143">Mitocondrio</text>
  <text class="label blue" x="248" y="238">Catena respiratoria</text>
  <text class="label blue" text-anchor="middle" x="576" y="209">Gradiente</text>
  <text class="label blue" text-anchor="middle" x="576" y="229">protonico</text>
  <text class="label yellow" x="24" y="302" font-size="16">Flusso di</text>

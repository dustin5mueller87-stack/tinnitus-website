name: Patch verified Arabic Bio 2 findings
on:
  push:
    branches: [arabic-translation-fixes-2026-09-07]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Bio 2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ar/meine-geschichte-teil-2.html')
          s=p.read_text(encoding='utf-8')
          replacements=[
            ('الانهيار إلى <bdi dir="ltr">75%</bdi>','الانهيار إلى نحو <bdi dir="ltr">50%</bdi>'),
            ('الانهيار إلى 75%','الانهيار إلى نحو 50%'),
            ('أن يعود إلى مستوى وحشي يعادل <bdi dir="ltr">75%</bdi> من شدة صوته الأصلية','أن يعود بقوة وحشية إلى نحو <bdi dir="ltr">50%</bdi> من شدة صوته عند إصابتي الأولى بطنين الأذن'),
            ('الانهيار النهائي: <bdi dir="ltr">75%</bdi> وفوضى الأصوات','الانهيار النهائي: نحو <bdi dir="ltr">50%</bdi> وفوضى الأصوات'),
            ('وفي أذني اليسرى بلغ، بحسب تقديري، ثلاثة أرباع (<bdi dir="ltr">75%</bdi>) شدة صوته عند أول انهيار لي على الإطلاق.','وفي أذني اليسرى بلغ نحو نصف شدة صوته عند إصابتي الأولى بطنين الأذن، أي نحو <bdi dir="ltr">50%</bdi>.'),
            ('الذي كنت أعرفه منذ فترة إصابتي الأولى بطنين الأذن','الذي كنت أعرفه وأستخدمه منذ فترة إصابتي الأولى بطنين الأذن'),
            ('وأضع الأدلة المادية المتاحة كلها مكشوفة أمامك على الطاولة: توثق مخططات السمع الصادرة عن الأطباء، والتي تُظهر الانخفاضات في الترددات، حصريًا مسار إصابتي الأولى بطنين الأذن؛ ولا يوجد مخطط سمع للإصابة الثانية. ويضاف إلى ذلك التقارير المخبرية، والتشخيصات، وفواتير العيادات والمعالجين.','وأملك كل دليل مادي على هذا الجحيم وعلى هذا التعافي: مخططات السمع الطبية الخاصة بي لمسار إصابتي الأولى بطنين الأذن، بما فيها من انخفاضات هائلة في الترددات، والتقارير المخبرية، والتشخيصات، وفواتير العيادات والمعالجين. ولا يوجد مخطط سمع للإصابة الثانية.')]
          n=0
          for a,b in replacements:
              c=s.count(a); print(c,a[:65]); s=s.replace(a,b); n+=c
          if n < 3: raise SystemExit(f'too few matches: {n}')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/patch-ar-bio2.yml
          git add ar/meine-geschichte-teil-2.html
          git config user.name arabic-translation-fix-bot
          git config user.email arabic-translation-fix-bot@users.noreply.github.com
          git commit -m "Fix verified Arabic Bio 2 translation issues"
          git push origin HEAD:arabic-translation-fixes-2026-09-07

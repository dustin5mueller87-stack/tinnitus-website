          repl('pt/acufenos-causados-pelo-stresse.html', '<p><strong>Em quarto lugar, através de pequenos efeitos de campo elétrico.</strong> Na parte do meu modelo que adotei a partir das abordagens de Michael Prgomet e do Dr. Klinghardt, pequenos efeitos locais reais de campo e de carga desempenham um papel. Segundo esta conceção, células nervosas sincronamente ativas podem coestimular células vizinhas. Trata-se de uma hipótese do modelo que atribuo a essas fontes, não de um processo medido diretamente nos acufenos causados pelo stresse.</p>', '<p><strong>Em quarto lugar, através de pequenos efeitos de campo elétrico.</strong> Quando muitas células nervosas estão ativas ao mesmo tempo e de forma sincronizada numa pequena região, surgem campos elétricos locais. Estes campos são pequenos, mas reais, e podem efetivamente levar células vizinhas a ultrapassar o limiar, fazendo com que elas próprias disparem.</p>')

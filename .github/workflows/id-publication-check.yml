name: Prepare checked Indonesian text corrections
run-name: Prepare Indonesian audit patch without moving production
on:
  push:
    branches: ["audit/id-publication-20260915-26f0b77"]
    paths: [".github/workflows/id-publication-check.yml"]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exact guarded replacements and isolated commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import difflib
          import hashlib
          import json
          import os
          import re
          import urllib.request

          REPO = 'dustin5mueller87-stack/tinnitus-website'
          API = 'https://api.github.com/repos/' + REPO
          BASE = '26f0b77145e7168b7f2f862887076a194e6d16c9'
          changes = []
          def add(path, sha, edits):
              changes.append({'path':'id/'+path, 'sha':sha, 'edits':edits})
          add('tinnitus-sembuh-kisah-saya.html','65f99a4ff0e685fb56845a8d35a8f9c4b30e1d5a',[
              ('Hasil tes darah saya: kadar B12 hanya sedikit di atas ambang kekurangan.',
               'Hasil tes darah saya: kekurangan B12, di ujung paling bawah skala.',1)])
          add('kisah-tinnitus-saya-bagian-1.html','b228bcc65f53fec3a015e4e781d8874d38ee57b9',[
              ('Hasilnya: Kadar B12 saya hanya sedikit di atas ambang kekurangan.',
               'Hasilnya: Kekurangan B12 terkonfirmasi.',1),
              ('Ternyata memikirkan B12 dan lesitin saja terlalu sempit. Saya sendiri.',
               'Ternyata memikirkan B12 dan lesitin saja terlalu sempit. Saya sendiri yang berpikir sesempit itu.',1),
              ('bukti gila yang sengaja saya lakukan bahwa model saya benar-benar bekerja',
               'pembuktian gila yang sengaja saya lakukan bahwa model saya benar-benar bekerja',1)])
          add('tinnitus-akibat-kebisingan.html','9f8d8a0639e7c257345577911d6e0a3001a43871',[
              ('tak lama kemudian bunyi yang sudah ada di telinga kanan juga menjadi jauh lebih keras',
               'tak lama kemudian telinga kanan juga ikut terkena',1),
              ('justru itulah yang memperburuk keadaan saya dan membuat bunyi lemah yang sudah ada di telinga kanan menjadi jauh lebih kuat',
               'justru itulah yang memperburuk keadaan saya dan membuat telinga kanan ikut terkena',1),
              ('<figcaption>Kiri normal, kanan setelah kerusakan akibat kebisingan: masing-masing rambut sensorik berubah posisi, tip-link terus menegang, dan kanal tetap terbuka lebih lebar.</figcaption>',
               '<figcaption>Kiri normal, kanan setelah kerusakan akibat kebisingan: berkas rambut sensorik menjadi miring, tip-link terus menegang, dan kanal tetap terbuka lebih lebar.</figcaption>',1)])
          alt = 'Gambaran skematis blokade enzim oleh merkuri: atom merkuri menempel pada lokasi tiol berunsur sulfur pada enzim, yaitu pompa kalsium bertenaga ATP, dan membengkokkan strukturnya sehingga fungsinya hilang – yang disebut peretasan tiol'
          add('tinnitus-akibat-obat-dan-zat-beracun.html','2271f3f6146b3c6892033a0ff05b01e7eb91fd10',[
              ('Di sini berlaku logika biologis sederhana dengan dua jalan keluar:',
               'Di sini berlaku logika biologis sederhana dengan dua kemungkinan hasil:',1),
              ('Jalan keluar 1 (kematian sel):','Hasil 1 (kematian sel):',1),
              ('Jalan keluar 2 (perjuangan bertahan hidup = tinnitus):',
               'Hasil 2 (perjuangan bertahan hidup = tinnitus):',1),
              (alt,alt.replace('enzim, yaitu pompa','enzim, misalnya pompa'),2)])
          add('pendekatan-saya.html','e981181ce53e438ccc707d17489efcf99aad8d17',[
              ('Dengan begitu, logam-logam itu masuk ke darah dan/atau urine dan dapat dideteksi melalui pemeriksaan laboratorium.',
               'Dengan begitu, logam-logam itu masuk ke aliran darah dan dari sana dapat mencapai urine, sehingga keberadaannya dapat dideteksi melalui pemeriksaan laboratorium.',1)])
          add('tinnitus-akibat-stres.html','d12188fa999a7907fcfde62c50637a8c09c24da2',[
              ('Salah satu jalan menuju perbaikan menurut model ini adalah menyadari konflik yang mendasari lalu menyelesaikannya di akar, misalnya dengan metode Michael Prgomet.',
               'Salah satu jalan yang mungkin membawa perbaikan menurut model ini adalah menyadari konflik yang mendasari lalu menyelesaikannya di akar, misalnya dengan metode Michael Prgomet.',1)])
          add('sumber-ilmiah.html','0d82b224f71427eee5fb6ccb8200c6f0347ec5b7',[
              ('Tidak setiap campuran natrium-glukosa bekerja sama',
               'Tidak semua campuran natrium-glukosa memberikan efek yang sama',1)])
          add('produk.html','c958fc5c58eace59a1eedfa77b2d041c5ebfc3ce',[
              ('Lesitin yang membawa lompatan besar kedua pada 2012 – dari 40 menjadi 60 sampai 65 persen. Lebih lanjut tentang itu ada di <a href="/id/kisah-tinnitus-saya-bagian-2">Biografi Bagian 2 saya</a>.',
               'Lesitin merupakan satu lagi bahan penting bagi saya. Saya mengonsumsi satu sendok makan granula itu setiap hari.',1)])
          guards = {
              'index.html':'3bbb317368893c3eb80924ab97d44cdbc57bb00e',
              'tinnitus-geheilt-erfahrungsbericht.html':'d87d859be61c24f8fc52f62f76551e34674cd8b0',
              'meine-geschichte-teil-1.html':'88b9e38f3edb2b59775f8c67c5d5f552a3f0bd98',
              'meine-geschichte-teil-2.html':'23a13c4f3712af61c718c1af35894adbbfbafba3',
              'laermbedingter-tinnitus.html':'3a5be315677a143fef64348acc89522bc21b223e',
              'medikamente-gifte-tinnitus.html':'44171dc0efd4e4bed96a187fe7a75f5d19312ed3',
              'mein-loesungsansatz.html':'ee6cd21cff04c7a4e67f85bd170edd6284476132',
              'stressbedingter-tinnitus.html':'f391707e7dc8184006bf404adad3e9a15d9115ee',
              'wissenschaftliche-quellen.html':'e99020ea729e12032a7964effc2d9e7769639b3e',
              'produkte.html':'11c893c9888106d4a9c6589b1ad2798f981734f2',
              'id/index.html':'5eaace628a38bd1fea8e1ad48cded6c6f825f131',
              'id/kisah-tinnitus-saya-bagian-2.html':'ade2f6b86733447a62f7877dd07930e0652abfbf',
              'site.js':'5c94a50ca44601fd55d8da1a969c4d6870379217',
              'site.css':'af3685dc318aaa548216dcaf0510fe412d3e0dff',
              '_redirects':'7280c12dc98817cd2bb7025d29ef3e83d9072d4a'
          }
          def api(path, payload=None):
              data = None if payload is None else json.dumps(payload,ensure_ascii=False).encode('utf-8')
              req = urllib.request.Request(API+path,data=data,headers={
                  'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json',
                  'Content-Type':'application/json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'Indonesian-audit-publication-check'})
              with urllib.request.urlopen(req,timeout=45) as response:
                  return json.load(response)
          def require(condition,message):
              if not condition:
                  raise RuntimeError(message)
          def git_hash(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          def check_main():
              require(api('/git/ref/heads/main')['object']['sha']==BASE,
                      'Main changed since inspection. STOP and rebase before publishing.')
          check_main()
          base_tree=api('/git/commits/'+BASE)['tree']['sha']
          response=api('/git/trees/'+base_tree+'?recursive=1')
          require(not response.get('truncated'),'Incomplete source tree')
          original={entry['path']:entry for entry in response['tree'] if entry['type']!='tree'}
          for path,sha in guards.items():
              require(original[path]['sha']==sha,'Reference changed: '+path)
          prepared=[]
          for item in changes:
              path,expected=item['path'],item['sha']
              require(path.startswith('id/') and path.endswith('.html'),'Unapproved target')
              require(original[path]['sha']==expected,'Target changed: '+path)
              raw=base64.b64decode(api('/git/blobs/'+expected)['content'])
              require(git_hash(raw)==expected,'Source blob mismatch: '+path)
              before=raw.decode('utf-8')
              after=before
              for old,new,count in item['edits']:
                  require(after.count(old)==count,'Exact-match count mismatch: '+path+' / '+old)
                  after=after.replace(old,new)
              require(after!=before,'No actual change: '+path)
              for pattern,label in [
                  (r'75\s*%','75 percent'),
                  (r'<script\b.*?</script>','scripts'),
                  (r'<svg\b.*?</svg>','SVG'),
                  (r'<!-- BEGIN ID IMAGE TRANSLATIONS -->.*?<!-- END ID IMAGE TRANSLATIONS -->','image transcriptions'),
                  (r'(?:src|href)="[^"\n]*\.(?:webp|png|jpg|jpeg|svg|ico)[^"\n]*"','image references')]:
                  require(re.findall(pattern,before,re.S)==re.findall(pattern,after,re.S),label+' changed: '+path)
              print(''.join(difflib.unified_diff(before.splitlines(True),after.splitlines(True),fromfile='a/'+path,tofile='b/'+path,n=2)))
              prepared.append((item,after,git_hash(after.encode('utf-8'))))
          check_main()
          entries=[]
          for item,content,expected in prepared:
              blob=api('/git/blobs',{'content':content,'encoding':'utf-8'})
              require(blob['sha']==expected,'Written blob mismatch')
              entries.append({'path':item['path'],'mode':original[item['path']]['mode'],'type':'blob','sha':blob['sha']})
          tree=api('/git/trees',{'base_tree':base_tree,'tree':entries})
          response=api('/git/trees/'+tree['sha']+'?recursive=1')
          require(not response.get('truncated'),'Incomplete result tree')
          result={entry['path']:entry for entry in response['tree'] if entry['type']!='tree'}
          require(set(original)==set(result),'A file was added or removed')
          changed=sorted(path for path in original if original[path]['sha']!=result[path]['sha'])
          require(changed==sorted(item['path'] for item in changes),'Unexpected changed paths')
          for path in set(original)-set(changed):
              require(original[path]==result[path],'Untouched entry changed: '+path)
          check_main()
          commit=api('/git/commits',{
              'message':'Indonesisch: gepruefte Textkorrekturen - Autorenstand 15.09.2026\n\nApply 16 exact local edits in 8 Indonesian HTML files. Preserve current main, other languages, German originals, 75-percent passages, functional noise-test wording, images and disabled chatbot. Use current German lecithin wording instead of the superseded biography link. No optional style rewrites.',
              'tree':tree['sha'],'parents':[BASE]})
          print('PREPARED_COMMIT='+commit['sha'])
          print('PREPARED_TREE='+tree['sha'])
          print('BASE_COMMIT='+BASE)
          print('VERIFIED_CHANGED_PATHS='+json.dumps(changed))
          print('No branch ref has been updated by this job.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write('# Prepared Indonesian corrections\n\nBase: `'+BASE+'`\n\nPrepared commit: `'+commit['sha']+'`\n\nAll other repository files unchanged. No production ref updated.\n\n')
              summary.write('\n'.join('- `'+path+'`' for path in changed)+'\n')

name: Test exact Arabic patch mechanism
on:
  push:
    branches: [arabic-translation-fixes-2026-09-07]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch one verified Bio 2 value
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ar/meine-geschichte-teil-2.html')
          s=p.read_text(encoding='utf-8')
          old='الانهيار النهائي: <bdi dir="ltr">75%</bdi> وفوضى الأصوات'
          new='الانهيار النهائي: نحو <bdi dir="ltr">50%</bdi> وفوضى الأصوات'
          print('match-count', s.count(old))
          if s.count(old) != 1:
              raise SystemExit('unexpected match count')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/test-ar-patch.yml
          git add ar/meine-geschichte-teil-2.html
          git config user.name "arabic-translation-fix-bot"
          git config user.email "arabic-translation-fix-bot@users.noreply.github.com"
          git commit -m "Test exact Arabic Bio 2 patch [arabic-patch-test]"
          git push origin HEAD:arabic-translation-fixes-2026-09-07

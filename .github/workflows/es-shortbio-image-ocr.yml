name: One-shot Spanish short biography image text audit

on:
  push:
    branches:
      - review/es-kurzbiografie-2026-08-30

permissions:
  contents: write

jobs:
  image-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: review/es-kurzbiografie-2026-08-30
          fetch-depth: 0

      - name: Install Spanish OCR support
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa imagemagick

      - name: Inspect image metadata and embedded text
        shell: bash
        run: |
          mkdir -p audit
          REPORT=audit/es-shortbio-image-text-audit.txt
          : > "$REPORT"
          printf 'Spanish short biography image text audit\n' >> "$REPORT"
          printf 'Branch: review/es-kurzbiografie-2026-08-30\n' >> "$REPORT"
          printf 'Method: ImageMagick identify plus Tesseract spa+eng, PSM 6 and 11\n' >> "$REPORT"
          printf 'OCR is a fallback check and may miss stylized text.\n\n' >> "$REPORT"

          files=(
            img/es-kurz-hero.webp
            img/kurz-mullbinden-stille.webp
            img/es-kurz-erste-heilung.webp
            img/es-kurz-haertetest.webp
            img/es-kurz-cfs-absturz.webp
            img/kurz-provokation.webp
            img/es-og-comprender-acufenos.webp
          )

          for f in "${files[@]}"; do
            printf '============================================================\n' >> "$REPORT"
            printf 'FILE: %s\n' "$f" >> "$REPORT"
            identify -format 'FORMAT=%m WIDTH=%w HEIGHT=%h COLORS=%k FILESIZE=%b\n' "$f" >> "$REPORT" 2>&1 || true
            printf '\nOCR PSM 6:\n' >> "$REPORT"
            tesseract "$f" stdout -l spa+eng --psm 6 2>/dev/null >> "$REPORT" || true
            printf '\nOCR PSM 11:\n' >> "$REPORT"
            tesseract "$f" stdout -l spa+eng --psm 11 2>/dev/null >> "$REPORT" || true
            printf '\n\n' >> "$REPORT"
          done

          printf '============================================================\n' >> "$REPORT"
          printf 'GERMAN TOKEN SCREEN\n' >> "$REPORT"
          grep -Ein 'Hölle|Heilung|Geschichte|Tinnitus-Hölle|Kurzversion|geschafft|Härte|Erste|Absturz|Lärm|Stille|Weg aus|Nährstoff|Ohr|Ohren' "$REPORT" || true

          rm -f .github/workflows/es-shortbio-image-ocr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT" .github/workflows/es-shortbio-image-ocr.yml
          git commit -m "Record Spanish short biography image text audit"
          git push origin HEAD:review/es-kurzbiografie-2026-08-30

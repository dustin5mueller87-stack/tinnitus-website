name: Patch core Arabic short biography findings
on:
  push:
    branches: [arabic-translation-fixes-2026-09-07]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch core short bio facts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ar/tinnitus-geheilt-erfahrungsbericht.html')
          s=p.read_text(encoding='utf-8')
          pairs=[
            ('فجأة ظهر ذلك الصفير والهسيس الجهنميان في الأذن اليسرى — وصفير خافت في اليمنى.','فجأة ظهر ذلك الصفير والهسيس الجهنميان في الأذن اليسرى، بينما لم أكن أسمع أي طنين في الأذن اليمنى آنذاك.'),
            ('وبعد أن اتبعت هذه النصيحة وواصلت تعريض نفسي للموسيقى والضوضاء، ازداد الصوت الخافت الموجود أصلًا في الأذن اليمنى سوءًا بوضوح بعد بضعة أيام.','وبعد أن اتبعت هذه النصيحة وواصلت تعريض نفسي للموسيقى والضوضاء، بدأت أسمع طنينًا في الأذن اليمنى أيضًا للمرة الأولى بعد بضعة أيام.'),
            ('عاد طنين الأذن بوحشية إلى <bdi dir="ltr">75%</bdi> من شدة صوته الأصلية','عاد طنين الأذن بقوة وحشية إلى نحو <bdi dir="ltr">50%</bdi> من شدة صوته عند إصابتي الأولى بطنين الأذن')]
          n=0
          for a,b in pairs:
              c=s.count(a); print(c); s=s.replace(a,b); n+=c
          if n != 3: raise SystemExit(f'unexpected matches: {n}')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/patch-ar-shortbio-core.yml
          git add ar/tinnitus-geheilt-erfahrungsbericht.html
          git config user.name arabic-translation-fix-bot
          git config user.email arabic-translation-fix-bot@users.noreply.github.com
          git commit -m "Fix core Arabic short biography facts"
          git push origin HEAD:arabic-translation-fixes-2026-09-07

name: Restore Spanish biography part 2 page structure

on:
  push:
    branches:
      - review/es-biografie-teil-2-2026-08-31

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/es-biografie-teil-2-2026-08-31
          fetch-depth: 0
      - name: Restore exact original page structure around reviewed text
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/restore.patch
          git apply --check /tmp/restore.patch
          git apply /tmp/restore.patch
          actual="$(git hash-object es/mi-historia-parte-2.html)"
          expected="320318c3d20f261af269f829c7c398afb6d35765"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected final blob: $actual (expected $expected)"
            exit 1
          fi
      - name: Commit only the restored page structure
        shell: bash
        run: |
          rm -f .github/workflows/es-bio2-restore-structure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/mi-historia-parte-2.html .github/workflows/es-bio2-restore-structure.yml
          git commit -m "Preserve Spanish biography part 2 page structure"
          git push origin HEAD:review/es-biografie-teil-2-2026-08-31

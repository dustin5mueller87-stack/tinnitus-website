          repl('pt/acufenos-causados-pelo-ruido.html', 'Estou convencido de que esta explicação é insuficiente. Precisamente porque o som ESTÁ LÁ, estou convencido de que um sinal anómalo ativo tem de surgir algures no tecido periférico ainda excitável. Na cadeia principal do mecanismo que descrevo, este sinal provém de uma célula ciliada interna ainda viva e desregulada. Noutras configurações periféricas, a fonte também poderia ser um nervo auditivo vivo que dispara de forma anómala devido a problemas de mielina ou a inflamação. Em contrapartida, tecido completamente morto já não envia qualquer sinal.', 'Estou convencido de que esta explicação é insuficiente. Uma célula ciliada morta já não envia qualquer sinal: fica em silêncio. Precisamente porque o som ESTÁ LÁ, a célula tem de continuar viva. Os acufenos não são o sinal de uma célula morta, mas de uma célula em luta pela sobrevivência. É perfeitamente possível que, num dano causado pelo ruído, algumas células ciliadas também morram definitivamente. Mas, segundo o meu entendimento, essas não participam no processo dos acufenos, porque já não enviam sinais. O som vem das células que ainda estão presentes e lutam, presas numa perda de função por falta de energia.')
          repl('pt/acufenos-causados-pelo-ruido.html', 'Os acufenos causados pelo ruído podem fazer-se notar logo após o evento de ruído, mas também podem só ser conscientemente percebidos horas ou dias mais tarde. No meu caso, só reparei no som no dia 3; até hoje, não sei ao certo porquê. Descreverei expressamente as possíveis explicações como hipóteses no FAQ.', 'Na maioria das pessoas afetadas, os acufenos começam pouco depois da exposição ao ruído, entre alguns minutos e poucas horas. Há, no entanto, casos em que só surgem horas ou mesmo dias mais tarde. Explico em pormenor na secção de perguntas frequentes por que razão isto pode acontecer de formas tão diferentes e que papel desempenham determinadas estruturas do ouvido.')

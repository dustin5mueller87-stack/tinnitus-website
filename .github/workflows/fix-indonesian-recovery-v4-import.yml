name: Fix Indonesian recovery v4 import

on:
  push:
    branches:
      - id-final-complete-repair-20260830
    paths:
      - .github/workflows/fix-indonesian-recovery-v4-import.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: id-final-complete-repair-20260830
          fetch-depth: 0
      - name: Remove premature BeautifulSoup import and retrigger recovery
        shell: bash
        run: |
          set -euo pipefail
          file='.github/workflows/publish-indonesian-recovery-v4.yml'
          test -f "$file"
          sed -i '/^[[:space:]]*from bs4 import BeautifulSoup[[:space:]]*$/d' "$file"
          git config user.name 'OpenAI Indonesian Recovery Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Indonesian recovery validation import'
          git push origin HEAD:id-final-complete-repair-20260830

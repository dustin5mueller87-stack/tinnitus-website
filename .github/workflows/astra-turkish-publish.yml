name: Astra Turkish translation publication

on:
  push:
    branches:
      - astra-turkish-translation-fixes-2026-09-07
    paths:
      - .github/workflows/astra-turkish-publish.yml

permissions:
  contents: write

jobs:
  apply-audited-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated publication branch
        uses: actions/checkout@v4
        with:
          ref: astra-turkish-translation-fixes-2026-09-07
          fetch-depth: 0

      - name: Assemble and apply guarded patch
        shell: bash
        run: |
          : > /tmp/apply.py
          for f in .astra-tr-parts/part*.pyfrag; do
            cat "$f" >> /tmp/apply.py
            printf '\n' >> /tmp/apply.py
          done
          python -m py_compile /tmp/apply.py
          python /tmp/apply.py | tee /tmp/patch-log.txt
          echo "=== skipped guards ==="
          grep '^SKIP ' /tmp/patch-log.txt || true

      - name: Verify patch and clean temporary files
        shell: bash
        run: |
          rm -rf .astra-tr-parts
          rm .github/workflows/astra-turkish-publish.yml
          git diff --check
          git status --short

      - name: Commit only audited publication changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply audited Turkish translation fixes"
          git push origin HEAD:astra-turkish-translation-fixes-2026-09-07

name: Correct Arabic 75 percent

on:
  push:
    branches:
      - correct-arabic-75-percent-2026-09-07

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ar-75-corrected]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore author-confirmed 75 percent value
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly 1 match, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          p='ar/meine-geschichte-teil-2.html'
          replace_exact(p,
              'الانهيار إلى نحو <bdi dir="ltr">50%</bdi>',
              'الانهيار إلى <bdi dir="ltr">75%</bdi>')
          replace_exact(p,
              'أن يعود بقوة وحشية إلى نحو <bdi dir="ltr">50%</bdi> من شدة صوته عند إصابتي الأولى بطنين الأذن',
              'أن يعود إلى مستوى وحشي يعادل <bdi dir="ltr">75%</bdi> من شدة صوته عند إصابتي الأولى بطنين الأذن')
          replace_exact(p,
              'الانهيار النهائي: نحو <bdi dir="ltr">50%</bdi> وفوضى الأصوات',
              'الانهيار النهائي: <bdi dir="ltr">75%</bdi> وفوضى الأصوات')
          replace_exact(p,
              'وفي أذني اليسرى بلغ نحو نصف شدة صوته عند إصابتي الأولى بطنين الأذن، أي نحو <bdi dir="ltr">50%</bdi>.',
              'وفي أذني اليسرى بلغ، بحسب تقديري، ثلاثة أرباع (<bdi dir="ltr">75%</bdi>) شدة صوته عند إصابتي الأولى بطنين الأذن.')

          p='ar/tinnitus-geheilt-erfahrungsbericht.html'
          replace_exact(p,
              'عاد طنين الأذن بقوة وحشية إلى نحو <bdi dir="ltr">50%</bdi> من شدة صوته عند إصابتي الأولى بطنين الأذن',
              'عاد طنين الأذن بوحشية إلى <bdi dir="ltr">75%</bdi> من شدة صوته عند إصابتي الأولى بطنين الأذن')
          PY
          git diff --check
          git rm .github/workflows/correct-arabic-75-percent.yml
          git add ar
          git config user.name "arabic-translation-fix-bot"
          git config user.email "arabic-translation-fix-bot@users.noreply.github.com"
          git commit -m "Restore author-confirmed Arabic 75 percent value [ar-75-corrected]"
          git push origin HEAD:correct-arabic-75-percent-2026-09-07

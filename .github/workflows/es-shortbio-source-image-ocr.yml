name: One-shot German source image text audit

on:
  push:
    branches:
      - review/es-kurzbiografie-2026-08-30

permissions:
  contents: write

jobs:
  image-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: review/es-kurzbiografie-2026-08-30
          fetch-depth: 0

      - name: Install German OCR support
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu imagemagick

      - name: Inspect German source images
        shell: bash
        run: |
          mkdir -p audit
          REPORT=audit/de-shortbio-source-image-text-audit.txt
          : > "$REPORT"
          printf 'German source images for Spanish short biography audit\n' >> "$REPORT"
          printf 'Method: ImageMagick identify plus Tesseract deu+eng, PSM 6 and 11\n\n' >> "$REPORT"

          files=(
            img/kurz-hero.webp
            img/kurz-mullbinden-stille.webp
            img/kurz-erste-heilung.webp
            img/kurz-haertetest.webp
            img/kurz-cfs-absturz.webp
            img/kurz-provokation.webp
            img/og-tinnitus-verstehen.webp
          )

          for f in "${files[@]}"; do
            printf '============================================================\n' >> "$REPORT"
            printf 'FILE: %s\n' "$f" >> "$REPORT"
            identify -format 'FORMAT=%m WIDTH=%w HEIGHT=%h COLORS=%k FILESIZE=%b\n' "$f" >> "$REPORT" 2>&1 || true
            printf '\nOCR PSM 6:\n' >> "$REPORT"
            tesseract "$f" stdout -l deu+eng --psm 6 2>/dev/null >> "$REPORT" || true
            printf '\nOCR PSM 11:\n' >> "$REPORT"
            tesseract "$f" stdout -l deu+eng --psm 11 2>/dev/null >> "$REPORT" || true
            printf '\n\n' >> "$REPORT"
          done

          rm -f .github/workflows/es-shortbio-source-image-ocr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$REPORT" .github/workflows/es-shortbio-source-image-ocr.yml
          git commit -m "Record German source image text audit"
          git push origin HEAD:review/es-kurzbiografie-2026-08-30

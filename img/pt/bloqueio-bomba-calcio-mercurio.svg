<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="698" viewBox="0 0 1240 698" role="img" aria-labelledby="title desc">
  <title id="title">Inibição da bomba de cálcio pelo mercúrio</title>
  <desc id="desc">Uma enzima, isto é, uma bomba de cálcio acionada por ATP, é bloqueada quando o mercúrio se liga ao seu local de ligação tiol que contém enxofre; a estrutura tridimensional deforma-se e a bomba perde a função.</desc>
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020916"/>
      <stop offset="0.6" stop-color="#071529"/>
      <stop offset="1" stop-color="#02060d"/>
    </linearGradient>
    <linearGradient id="pumpB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55c3e8"/>
      <stop offset="0.45" stop-color="#1d7cae"/>
      <stop offset="1" stop-color="#0d365a"/>
    </linearGradient>
    <linearGradient id="membraneB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19456c"/>
      <stop offset="0.5" stop-color="#0b223a"/>
      <stop offset="1" stop-color="#19456c"/>
    </linearGradient>
    <radialGradient id="mercuryB" cx="32%" cy="25%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.26" stop-color="#d8e0e8"/>
      <stop offset="0.62" stop-color="#7f8996"/>
      <stop offset="1" stop-color="#2c3440"/>
    </radialGradient>
    <radialGradient id="calciumB" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff9bc"/>
      <stop offset="0.35" stop-color="#ffd146"/>
      <stop offset="1" stop-color="#e56b18"/>
    </radialGradient>
    <filter id="glowB" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowB" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <marker id="arrowYellowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffc83d"/>
    </marker>
    <marker id="arrowRedB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff5d5d"/>
    </marker>
  </defs>

  <rect width="1240" height="698" fill="url(#bgB)"/>

  <!-- Título: a identidade entre enzima e bomba é explícita. -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="620" y="49" fill="#f2f8fd" font-size="31" font-weight="700">INIBIÇÃO ENZIMÁTICA PELO MERCÚRIO</text>
    <text x="620" y="82" fill="#82d5f0" font-size="20">A enzima é a bomba de cálcio acionada por ATP</text>
  </g>

  <!-- Três afirmações do mecanismo, sempre sobre a mesma estrutura. -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="25" y="109" width="360" height="88" rx="13" fill="#0d2035" stroke="#3986b1"/>
    <circle cx="55" cy="138" r="17" fill="#2d91bd"/>
    <text x="55" y="144" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <text x="82" y="137" fill="#8edbf1" font-size="16" font-weight="700">UMA ÚNICA ESTRUTURA</text>
    <text x="82" y="160" fill="#f3f8fc" font-size="16">Enzima = bomba de cálcio</text>
    <text x="82" y="181" fill="#f3f8fc" font-size="16">acionada por ATP</text>

    <rect x="440" y="109" width="360" height="88" rx="13" fill="#211916" stroke="#b58738"/>
    <circle cx="470" cy="138" r="17" fill="#d29328"/>
    <text x="470" y="144" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">2</text>
    <text x="497" y="137" fill="#ffd66d" font-size="16" font-weight="700">LIGAÇÃO AO GRUPO TIOL</text>
    <text x="497" y="159" fill="#f3f8fc" font-size="15.5">O mercúrio liga-se ao enxofre</text>
    <text x="497" y="180" fill="#f3f8fc" font-size="15.5">do local de ligação –SH</text>

    <rect x="855" y="109" width="360" height="88" rx="13" fill="#261215" stroke="#bf555c"/>
    <circle cx="885" cy="138" r="17" fill="#cf4854"/>
    <text x="885" y="144" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">3</text>
    <text x="912" y="137" fill="#ff8489" font-size="16" font-weight="700">BLOQUEIO DA BOMBA</text>
    <text x="912" y="158" fill="#f3f8fc" font-size="15.5">A estrutura 3D deforma-se;</text>
    <text x="912" y="179" fill="#f3f8fc" font-size="15.5">a bomba fica bloqueada e perde a função</text>
  </g>

  <!-- Contexto celular: apenas membrana, bomba e cálcio. -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="254" fill="#7bcce9" font-size="16" font-weight="700">EXTERIOR DA CÉLULA</text>
    <text x="48" y="550" fill="#7bcce9" font-size="16" font-weight="700">INTERIOR DA CÉLULA CILIADA</text>
    <rect x="25" y="360" width="1190" height="96" rx="32" fill="url(#membraneB)" stroke="#367aa2" stroke-width="2"/>
    <g fill="#4d99bd" stroke="#8edcf1" stroke-width="1" opacity="0.9">
      <circle cx="48" cy="373" r="9"/><circle cx="82" cy="373" r="9"/><circle cx="116" cy="373" r="9"/><circle cx="150" cy="373" r="9"/>
      <circle cx="184" cy="373" r="9"/><circle cx="218" cy="373" r="9"/><circle cx="252" cy="373" r="9"/><circle cx="286" cy="373" r="9"/>
      <circle cx="320" cy="373" r="9"/><circle cx="354" cy="373" r="9"/><circle cx="388" cy="373" r="9"/><circle cx="422" cy="373" r="9"/>
      <circle cx="818" cy="373" r="9"/><circle cx="852" cy="373" r="9"/><circle cx="886" cy="373" r="9"/><circle cx="920" cy="373" r="9"/>
      <circle cx="954" cy="373" r="9"/><circle cx="988" cy="373" r="9"/><circle cx="1022" cy="373" r="9"/><circle cx="1056" cy="373" r="9"/>
      <circle cx="1090" cy="373" r="9"/><circle cx="1124" cy="373" r="9"/><circle cx="1158" cy="373" r="9"/><circle cx="1192" cy="373" r="9"/>
      <circle cx="48" cy="443" r="9"/><circle cx="82" cy="443" r="9"/><circle cx="116" cy="443" r="9"/><circle cx="150" cy="443" r="9"/>
      <circle cx="184" cy="443" r="9"/><circle cx="218" cy="443" r="9"/><circle cx="252" cy="443" r="9"/><circle cx="286" cy="443" r="9"/>
      <circle cx="320" cy="443" r="9"/><circle cx="354" cy="443" r="9"/><circle cx="388" cy="443" r="9"/><circle cx="422" cy="443" r="9"/>
      <circle cx="818" cy="443" r="9"/><circle cx="852" cy="443" r="9"/><circle cx="886" cy="443" r="9"/><circle cx="920" cy="443" r="9"/>
      <circle cx="954" cy="443" r="9"/><circle cx="988" cy="443" r="9"/><circle cx="1022" cy="443" r="9"/><circle cx="1056" cy="443" r="9"/>
      <circle cx="1090" cy="443" r="9"/><circle cx="1124" cy="443" r="9"/><circle cx="1158" cy="443" r="9"/><circle cx="1192" cy="443" r="9"/>
    </g>

    <!-- Uma única bomba transmembranar, já bloqueada e deformada. -->
    <path d="M444 347 C413 306 432 258 480 244 C526 231 554 258 576 289 C593 314 621 316 643 292 C671 261 704 240 744 252 C789 266 811 313 791 350 C775 379 783 410 799 437 C820 474 808 520 766 537 C730 551 696 531 670 507 C642 481 611 483 583 511 C553 541 508 548 474 525 C433 497 425 449 449 413 C463 391 461 368 444 347 Z" fill="url(#pumpB)" stroke="#83d9f1" stroke-width="3" filter="url(#shadowB)"/>
    <path d="M521 276 C552 307 556 345 534 382 C517 411 522 457 552 499" fill="none" stroke="#a9edff" stroke-width="3" opacity="0.7"/>
    <path d="M720 271 C688 312 685 353 710 386 C733 417 728 471 694 511" fill="none" stroke="#0a3152" stroke-width="13" opacity="0.75"/>
    <rect x="500" y="385" width="238" height="50" rx="12" fill="#06101d" fill-opacity="0.86" stroke="#77cce8"/>
    <text x="619" y="405" fill="#ffffff" font-size="15" text-anchor="middle" font-weight="700">ENZIMA = BOMBA DE CÁLCIO</text>
    <text x="619" y="425" fill="#8ddbf0" font-size="14" text-anchor="middle">ACIONADA POR ATP</text>

    <!-- ATP que aciona a mesma bomba -->
    <path d="M299 307 H456" fill="none" stroke="#ffc83d" stroke-width="4" marker-end="url(#arrowYellowB)"/>
    <path d="M237 272 L205 323 H236 L218 370 L280 303 H248 L270 272 Z" fill="#ffd540" stroke="#fff2a0" stroke-width="2" filter="url(#glowB)"/>
    <text x="241" y="395" fill="#ffdc5f" font-size="22" font-weight="700" text-anchor="middle">ATP</text>
    <text x="321" y="291" fill="#ffdc5f" font-size="14">energia para a bomba</text>

    <!-- Cálcio no interior e tentativa de transporte bloqueada -->
    <g fill="url(#calciumB)" stroke="#fff1a0" stroke-width="1.5" filter="url(#glowB)">
      <circle cx="494" cy="597" r="19"/><circle cx="558" cy="626" r="19"/><circle cx="631" cy="586" r="19"/><circle cx="702" cy="626" r="19"/>
    </g>
    <g fill="#4b2707" font-size="14" font-weight="700" text-anchor="middle">
      <text x="494" y="602">Ca²⁺</text><text x="558" y="631">Ca²⁺</text><text x="631" y="591">Ca²⁺</text><text x="702" y="631">Ca²⁺</text>
    </g>
    <path d="M631 566 V480" fill="none" stroke="#ffc83d" stroke-width="4" marker-end="url(#arrowYellowB)"/>
    <path d="M600 474 L660 514 M660 474 L600 514" stroke="#ff595f" stroke-width="9" stroke-linecap="round" filter="url(#glowB)"/>
    <text x="785" y="598" fill="#ff858a" font-size="18" font-weight="700">Transporte de Ca²⁺ bloqueado</text>
    <path d="M781 585 H674" stroke="#ff696e" stroke-width="2" marker-end="url(#arrowRedB)"/>

    <!-- Grupo tiol: o mercúrio liga-se ao enxofre desta mesma bomba. -->
    <circle cx="753" cy="300" r="24" fill="#ffc83d" stroke="#fff1a1" stroke-width="2.5" filter="url(#glowB)"/>
    <text x="753" y="307" fill="#4b2707" font-size="20" font-weight="700" text-anchor="middle">S</text>
    <text x="701" y="235" fill="#ffd86a" font-size="15" font-weight="700">LOCAL DE LIGAÇÃO TIOL (–SH)</text>
    <path d="M827 239 H775 L759 278" fill="none" stroke="#ffd86a" stroke-width="2"/>
    <text x="707" y="257" fill="#f6f8fa" font-size="13.5">contém enxofre</text>

    <circle cx="876" cy="292" r="52" fill="#aab5c2" stroke="#f3f6f9" stroke-width="3"/>
    <circle cx="860" cy="275" r="25" fill="#e8edf2" opacity="0.72"/>
    <text x="876" y="302" fill="#15202b" font-size="25" font-weight="700" text-anchor="middle">Hg</text>
    <path d="M824 296 H779" stroke="#ff5e5e" stroke-width="7" stroke-linecap="round"/>
    <text x="948" y="326" fill="#ff8b8f" font-size="15" font-weight="700">LIGAÇÃO Hg–S</text>
    <text x="948" y="285" fill="#f1f5f8" font-size="19" font-weight="700">MERCÚRIO</text>
    <path d="M943 291 H930" stroke="#dce5ec" stroke-width="2"/>

    <!-- Resultado sem um segundo referente molecular. -->
    <rect x="915" y="347" width="275" height="122" rx="13" fill="#250f13" stroke="#d25058" stroke-width="2"/>
    <text x="1052" y="379" fill="#ff7e84" font-size="17" font-weight="700" text-anchor="middle">A MESMA BOMBA</text>
    <text x="1052" y="407" fill="#ffffff" font-size="16" text-anchor="middle">deforma-se</text>
    <text x="1052" y="431" fill="#ffffff" font-size="16" text-anchor="middle">fica bloqueada</text>
    <text x="1052" y="455" fill="#ffffff" font-size="16" text-anchor="middle">e perde a função</text>
    <path d="M914 410 H812" stroke="#ff5d5d" stroke-width="3" marker-end="url(#arrowRedB)"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="25" y="660" width="1190" height="25" rx="7" fill="#0a1624" stroke="#263e54"/>
    <text x="620" y="678" fill="#b9cfde" font-size="13.5" text-anchor="middle">Mercúrio → ligação ao enxofre do grupo tiol → deformação da enzima, isto é, da bomba de cálcio → bloqueio funcional</text>
  </g>
</svg>

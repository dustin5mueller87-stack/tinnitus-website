name: Build Spanish biography part 2 audit input

on:
  push:
    branches:
      - review/es-biografie-teil-2-2026-08-31

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
        with:
          ref: review/es-biografie-teil-2-2026-08-31
          fetch-depth: 0

      - name: Collect only biography part 2 inputs
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import hashlib
          import json
          import re
          import shutil

          root = Path('.')
          out = Path('audit-bundle')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          html_files = [Path('meine-geschichte-teil-2.html'), Path('es/mi-historia-parte-2.html')]
          fixed = html_files + [Path('site.css'), Path('site.js')]
          assets: set[Path] = set()

          for html_path in html_files:
              text = html_path.read_text(encoding='utf-8')
              for attr in ('src', 'href', 'content'):
                  for value in re.findall(rf'{attr}="([^"]+)"', text):
                      if value.startswith(('http://', 'https://', '#', 'mailto:', 'tel:', 'data:')):
                          continue
                      clean = value.split('?', 1)[0].split('#', 1)[0]
                      if not clean:
                          continue
                      candidate = Path(clean.lstrip('/'))
                      if html_path.parent != Path('.') and not clean.startswith('/'):
                          candidate = (html_path.parent / clean).resolve().relative_to(root.resolve())
                      if candidate.suffix.lower() in {'.webp', '.png', '.jpg', '.jpeg', '.svg', '.gif', '.avif'}:
                          assets.add(candidate)

          all_files = fixed + sorted(assets)
          copied = []
          for rel in all_files:
              if not rel.exists():
                  raise SystemExit(f'Missing required file: {rel}')
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(rel, dest)
              copied.append(rel.as_posix())

          manifest = {
              'source_commit': '5eadfad53a8a4d8c6944da7cb3560d47e66aff61',
              'german_html_blob': 'ee40b7606cfaa6e64367d85cae9df87e537d2b11',
              'spanish_html_blob': '4077322414bea4abd91aeb5641270109451014ab',
              'files': [],
          }
          for rel in all_files:
              data = rel.read_bytes()
              manifest['files'].append({
                  'path': rel.as_posix(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          (out / 'MANIFEST.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          print('\n'.join(copied))
          PY

      - name: Upload exact audit input
        uses: actions/upload-artifact@v4
        with:
          name: es-biografie-teil-2-audit-input
          path: audit-bundle
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/es-bio2-audit-input.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/es-bio2-audit-input.yml
          git commit -m "Remove one-shot Spanish biography part 2 audit workflow"
          git push origin HEAD:review/es-biografie-teil-2-2026-08-31

          repl('pt/acufenos-causados-pelo-stresse.html', 'Penfield e Perot relataram, em 1963, que a estimulação elétrica cortical provocou, em alguns pacientes, experiências auditivas sem uma fonte sonora externa. Isto apoia o ponto restrito de que a estimulação elétrica do cérebro pode desencadear perceções sonoras. Não prova nem o foco associado ao conflito por resolver nem o presumido percurso de campo e descarga.', 'Já na década de 1950, investigadores como Wilder Penfield realizaram em Montreal experiências em que estimulavam eletricamente o cérebro de pacientes. Muitos deles ouviram sons, música ou vozes, embora não existisse qualquer fonte acústica. Estas experiências demonstraram que a estimulação elétrica de determinadas áreas cerebrais ou de nervos auditivos produz um som, mesmo sem uma fonte sonora.')

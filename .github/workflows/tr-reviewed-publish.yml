name: Apply reviewed Turkish corrections safely

on:
  push:
    branches:
      - tr-reviewed-publish-20260904

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[tr-final]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed corrections and validate
        run: |
          set -o pipefail
          python .github/tr-publish/apply_all_current.py 2>&1 | tee _tr_publish_run.log

      - name: Capture audit diagnostics
        if: always()
        run: |
          mkdir -p _tr_publish_artifact
          cp _tr_publish_run.log _tr_publish_artifact/RUN.log || true
          git status --short > _tr_publish_artifact/GIT_STATUS.txt
          git diff --name-status > _tr_publish_artifact/NAME_STATUS.txt
          git diff --stat > _tr_publish_artifact/DIFF_STAT.txt

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turkish-reviewed-publication
          path: _tr_publish_artifact/
          if-no-files-found: error

      - name: Commit only the validated website files
        run: |
          rm -rf .github/tr-publish
          rm -f .github/workflows/tr-reviewed-publish.yml
          rm -rf _tr_publish_artifact _tr_publish_run.log

          git config user.name "OpenAI Turkish Translation Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          allowed='^(tr/index\.html|tr/tinnitus-iyilesme-hikayem\.html|tr/hikayem-bolum-1\.html|tr/hikayem-bolum-2\.html|tr/gurultuye-bagli-tinnitus\.html|tr/site\.webmanifest|sitemap\.xml|\.github/tr-publish/.*|\.github/workflows/tr-reviewed-publish\.yml)$'
          unexpected="$(git diff --cached --name-only | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected staged paths:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          non_turkish_html="$(git diff --cached --name-only --diff-filter=ACMR | grep -E '\.html$' | grep -v '^tr/' || true)"
          if [ -n "$non_turkish_html" ]; then
            echo "A non-Turkish HTML file would change:" >&2
            echo "$non_turkish_html" >&2
            exit 1
          fi

          test -z "$(git diff --cached --name-only | grep '^site\.js$' || true)"

          cat > /tmp/expected-site-files.txt <<'EOF'
          sitemap.xml
          tr/gurultuye-bagli-tinnitus.html
          tr/hikayem-bolum-1.html
          tr/hikayem-bolum-2.html
          tr/index.html
          tr/site.webmanifest
          tr/tinnitus-iyilesme-hikayem.html
          EOF
          git diff --cached --name-only --diff-filter=ACMR | grep -E '^(sitemap\.xml|tr/)' | sort > /tmp/actual-site-files.txt
          diff -u /tmp/expected-site-files.txt /tmp/actual-site-files.txt

          git commit -m "[tr-final] Apply reviewed Turkish translation corrections"
          git push origin HEAD:tr-reviewed-publish-20260904

name: Apply audited English fixes, stage 2

on:
  push:
    branches:
      - english-audit-fixes-2026-09-02

permissions:
  contents: write

jobs:
  apply-stage-2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          ref: english-audit-fixes-2026-09-02
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply controlled story-part-2 and noise-page fixes
        run: python .github/scripts/apply_english_audit_stage2.py

      - name: Remove one-shot automation files
        run: git rm .github/workflows/english-audit-stage2.yml .github/scripts/apply_english_audit_stage2.py

      - name: Validate changed paths and whitespace
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess

          allowed = {
              "en/my-story-part-2.html",
              "en/noise-induced-tinnitus.html",
              ".github/workflows/english-audit-stage2.yml",
              ".github/scripts/apply_english_audit_stage2.py",
          }
          required = {
              "en/my-story-part-2.html",
              "en/noise-induced-tinnitus.html",
          }
          lines = subprocess.check_output(["git", "status", "--porcelain"], text=True).splitlines()
          changed = set()
          for line in lines:
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)
          unexpected = changed - allowed
          missing = required - changed
          if unexpected:
              raise SystemExit(f"Unexpected changed paths: {sorted(unexpected)}")
          if missing:
              raise SystemExit(f"Expected changed paths missing: {sorted(missing)}")
          print("Changed paths validated:", sorted(changed))
          PY

      - name: Commit the validated stage
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply audited English fixes to story part 2 and noise page"
          git push origin HEAD:english-audit-fixes-2026-09-02

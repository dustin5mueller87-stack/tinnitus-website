name: Apply verified English translation fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-english-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: Apply verified translation fixes only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          EN_FILES = [
              'en/index.html',
              'en/tinnitus-recovery-my-story.html',
              'en/my-story-part-1.html',
              'en/my-story-part-2.html',
              'en/my-approach.html',
              'en/scientific-sources.html',
              'en/testimonials.html',
              'en/products.html',
              'en/imprint.html',
              'en/privacy.html',
              'en/contact.html',
              'en/noise-induced-tinnitus.html',
              'en/medication-toxin-tinnitus.html',
              'en/stress-related-tinnitus.html',
          ]

          changed = set()

          def repl(path, old, new, expected=1, label=''):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n == 0:
                  if new and new in s:
                      print(f'ALREADY {path}: {label or old[:60]}')
                      return
                  raise SystemExit(f'MISSING expected text in {path}: {label or old[:160]!r}')
              if expected is not None and n != expected:
                  raise SystemExit(f'COUNT MISMATCH {path}: expected {expected}, found {n}: {label or old[:160]!r}')
              s2 = s.replace(old, new, n if expected is None else expected)
              p.write_text(s2, encoding='utf-8')
              changed.add(path)
              print(f'FIXED {path}: {label or old[:60]} ({n}x)')

          def repl_all_present(path, old, new, label=''):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n == 0:
                  if new in s:
                      print(f'ALREADY {path}: {label or old[:60]}')
                      return
                  raise SystemExit(f'MISSING expected text in {path}: {label or old[:160]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')
              changed.add(path)
              print(f'FIXED {path}: {label or old[:60]} ({n}x)')

          for path in EN_FILES:
              repl_all_present(
                  path,
                  'Medication- and Toxin-Induced Tinnitus (Ototoxicity)</a>',
                  'Medication- and Toxin-Induced Tinnitus</a>',
                  'remove extra Ototoxicity from reviewed link labels',
              )

          repl('en/index.html', 'What You’ll Find on This Page', 'What you’ll find on this page', 1, 'eyebrow sentence case')
          repl('en/index.html', 'My specific approach—step by step, with supporting evidence.', 'My specific approach to a solution—step by step, with supporting evidence.', 1, 'restore solution reference in contents')
          repl('en/index.html', '>My Specific Approach<', '>My Specific Approach to a Solution<', 1, 'restore solution reference in section heading')
          repl('en/index.html', 'I reported those values so the ENT doctor would perform the hearing test and Germany’s statutory health insurance would cover it.', 'I reported those values only so the ENT doctor would perform the hearing test and Germany’s statutory health insurance would cover it.', 1, 'restore exclusive purpose in audiogram 3 comment')
          repl('en/index.html', 'Immunological diagnosis—interpretation of results', 'Immunological diagnostics—interpretation of results', 1, 'diagnostics not diagnosis')

          repl('en/tinnitus-recovery-my-story.html', ' Today, I see energy/ATP as the primary lever, with cell membranes and stereocilia at the center of my model; myelin or auditory-nerve involvement remains possible, but uncertain.', '', 1, 'remove added current model sentence after lecithin')
          repl('en/tinnitus-recovery-my-story.html', ' Today, my model centers on energy/ATP, cell membranes, and stereocilia; myelin involvement remains possible, but uncertain.', '', 1, 'remove added current model sentence at first healing')
          repl('en/tinnitus-recovery-my-story.html', ' Today, I see energy/ATP as the primary lever, with myelin involvement possible but uncertain.', '', 1, 'remove added current model sentence in amino-acid paragraph')
          repl('en/tinnitus-recovery-my-story.html', 'permanently charged to what felt like 200% capacity', 'permanently charged to 200% capacity', 1, 'remove added felt marker')
          repl('en/tinnitus-recovery-my-story.html', 'my stomach, which was still badly weakened at the time', 'my stomach, which was still weakened at the time', 1, 'restore stomach intensity')
          repl('en/tinnitus-recovery-my-story.html', 'Evidence Against Masking', 'Proof Against Masking', 1, 'restore proof wording')
          repl('en/tinnitus-recovery-my-story.html', 'exactly what doctors recommend for masking', 'the very sound doctors recommend for masking', 1, 'keep doctor recommendation tied to sound, not extreme volume')

          repl('en/my-story-part-1.html', 'I developed inflammation in my ear canal', 'I developed inflammation in my ear canal due to an infection', 1, 'restore infection cause')
          repl('en/my-story-part-1.html', ' I had deliberately checked each ear separately.', '', 1, 'remove extra separate-ear-test sentence')
          repl('en/my-story-part-1.html', 'the perfect setup for a very low B12 level', 'the perfect setup for a B12 deficiency', 1, 'restore B12 deficiency-risk wording')
          repl_all_present('en/my-story-part-1.html', 'just short of a confirmed deficiency', 'just above the deficiency threshold', 'clarify B12 threshold without claiming deficiency')
          repl('en/my-story-part-1.html', 'that you can heal the “incurable” yourself', 'that even the “incurable” can be healed', 1, 'restore emphasis on even the incurable')

          repl('en/my-story-part-2.html', 'Evidence Against Masking', 'Proof Against Masking', 1, 'restore proof wording')
          repl('en/my-story-part-2.html', 'friends’ birthday parties', 'birthday parties with friends', 1, 'friends are companions, not necessarily birthday hosts')

          repl('en/products.html', 'For years, I have regularly taken 3 mg of melatonin in the evening in addition to the mineral complex.', 'For years, I regularly took 3 mg of melatonin in the evening in addition to the mineral complex.', 1, 'keep historical 3 mg melatonin statement historical')
          repl('en/products.html', 'how targeted conflict work helped him fully resolve these conflicts and bring his autonomic nervous system back into balance', 'how targeted conflict work helped him bring his autonomic nervous system back into balance', 1, 'remove added complete conflict-resolution result from product profile')

          repl('en/privacy.html', 'meta and communication data', 'metadata and communication data', 1, 'natural term metadata')
          repl('en/privacy.html', 'calculate a commission', 'settle a commission', 1, 'commission settlement not merely calculation')

          repl_all_present('en/contact.html', 'Contact Dustin Müller: Feel free to write to me with questions about my story or my approaches.', 'Contact Dustin Müller: Feel free to write to me with questions about my story or my approaches to a solution.', 'restore solution reference in contact descriptions')

          repl('en/noise-induced-tinnitus.html', 'the ATP lab finding documents a value of 0.37 during his time with CFS.', 'He has also overcome severe chronic fatigue syndrome (CFS).', 1, 'restore overcome-CFS statement in profile')
          repl('en/noise-induced-tinnitus.html', 'On my approach page, I explain in detail', 'On my page about my approach to a solution, I explain in detail', 1, 'restore solution reference')

          repl('en/medication-toxin-tinnitus.html', 'the ATP lab finding documents a value of 0.37 during his time with CFS.', 'He has also overcome severe chronic fatigue syndrome (CFS).', 1, 'restore overcome-CFS statement in profile')
          repl('en/medication-toxin-tinnitus.html', 'The myelin sheath may already be slightly thinned, the calcium pumps are already running closer to their limit, or the cells are working right at the edge.', 'The myelin sheath may already be slightly thinned, the calcium pumps are already running closer to their limit, and the cells are working right at the edge.', 1, 'simultaneous pump and cell strain')
          repl('en/medication-toxin-tinnitus.html', 'which also forms the basis for the approaches we’ll discuss later on this website.', 'which also forms the basis for the approaches to a solution we’ll discuss later on this website.', 1, 'restore solution reference')
          repl('en/medication-toxin-tinnitus.html', 'A medication at a toxic dose—or a heavy metal or environmental toxin—reaches the inner ear through the bloodstream.', 'A medication at a toxic high dose—or a heavy metal or environmental toxin—reaches the inner ear through the bloodstream.', 1, 'restore toxic high-dose wording')

          repl('en/stress-related-tinnitus.html', 'the ATP lab finding documents a value of 0.37 during his time with CFS.', 'He has also overcome severe chronic fatigue syndrome (CFS).', 1, 'restore overcome-CFS statement in profile')
          repl('en/stress-related-tinnitus.html', 'working through those conflicts helped him bring his autonomic nervous system back into balance', 'working through those conflicts helped him fully resolve these conflicts and bring his autonomic nervous system back into balance', 1, 'restore complete conflict resolution in stress-page profile')
          repl('en/stress-related-tinnitus.html', 'It was his work that helped me enormously to fully resolve the conflicts of my CFS and psychosomatic phase and bring my autonomic nervous system back into balance.', 'It was his work that finally helped me gradually resolve these deep-seated inner tensions.', 1, 'restore gradual early-story wording')
          repl('en/stress-related-tinnitus.html', 'The fact that a symptom persists even without acute stress does not, by itself, demonstrate any particular cause; within this model, persistent abnormal central activity may be one possible explanation.', 'Duration is a crucial clue: when a symptom persists even without acute stress, chronic abnormal electrical activity in the nervous system is usually present.', 1, 'restore duration clue')

          repl('en/testimonials.html', 'They summarize positive changes reported in connection with tinnitus and nutrient-based approaches.', 'They show that people around the world, independently of one another and without knowing each other, report similar experiences with tinnitus and a nutrient-based approach.', 1, 'restore independent-worldwide-experience argument')
          repl('en/testimonials.html', 'Describes a longer course in which several health complaints developed over time.', 'Describes a longer course involving several health complaints occurring at the same time.', 1, 'restore simultaneous complaints')

          repl('en/scientific-sources.html', 'Why the Dose Matters', 'Why the Dose Matters Most', 1, 'restore dose priority in heading')
          repl('en/scientific-sources.html', 'important under Guardrail 8', 'important', 1, 'remove internal guardrail reference')

          print('CHANGED FILES:', ', '.join(sorted(changed)))
          PY
      - name: Commit safely on top of latest main
        shell: bash
        run: |
          rm -f .github/workflows/apply-english-fixes.yml
          git config user.name "translation-fix-bot"
          git config user.email "translation-fix-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix verified English translation issues"
          git pull --rebase origin main
          git push origin HEAD:main

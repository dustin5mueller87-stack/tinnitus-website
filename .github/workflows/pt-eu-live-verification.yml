name: Verify Portuguese production release
on:
  push:
    branches: ["tooling/pt-eu-livecheck-20260917"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify repository preservation and eleven live HTML responses
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: python
        run: |
          import os, json, base64, hashlib, pathlib, re, time, urllib.request
          repo = os.environ['REPO']
          assert repo == 'dustin5mueller87-stack/tinnitus-website'
          out = pathlib.Path('verification'); out.mkdir()
          root = 'https://api.github.com/repos/' + repo
          def api(path):
              req = urllib.request.Request(root + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'pt-eu-production-verification'})
              with urllib.request.urlopen(req, timeout=30) as response: return json.load(response)
          base = '459a5ea49272243673a7528c0f4a89c4ab0904d0'
          published = '8f50f178fd323074e3b9aeea212e9b676e0a8993'
          expected = {
              'pt/index.html': '365b89161f9eb82ea5242144a4c4af38b30e98fa',
              'pt/o-meu-colapso-com-acufenos.html': 'd5b4026797ff225dd4e1cb82fc64fb1ba78efd71',
              'pt/a-minha-historia-parte-1.html': 'aa7125ac3d045e75dbeaaf3aecc6830b3919d948',
              'pt/a-minha-historia-parte-2.html': '656e9ca3aaa69a78a3ff6e6358153e26333dc090',
              'pt/acufenos-causados-pelo-ruido.html': '97b3088c33dfed83b54870dfc4eb0a352164a790',
              'pt/a-minha-abordagem.html': '1dab25eab5ab5365713d30810bb64657fc2dfa04',
              'pt/fontes-cientificas.html': '86f7dec216c46b4501daadac912ae0d4b0787ba9',
              'pt/relatos-de-experiencias.html': 'f8bb0b17d5802064386ed209d337866045718b39',
              'pt/produtos.html': '1895e3b8e92562e2ffd46b0b36a493ce0b6efefa',
              'pt/acufenos-medicamentos-substancias-toxicas.html': 'fe3b980bda37b0da82aa8d687ad585b2b97c358a',
              'pt/faq.html': 'd5eab70aa1945770a0261b3699572d030dac2512'
          }
          def tree_at(ref):
              c = api('/git/commits/' + ref)
              tree = api('/git/trees/' + c['tree']['sha'] + '?recursive=1')
              assert not tree.get('truncated')
              return {e['path']: e['sha'] for e in tree['tree'] if e['type'] == 'blob'}
          before = tree_at(base); after = tree_at(published)
          changed = {p for p in before.keys() | after.keys() if before.get(p) != after.get(p)}
          assert changed == set(expected), sorted(changed)
          assert all(after[p] == s for p, s in expected.items())
          assert api('/git/ref/heads/main')['object']['sha'] == published, 'main moved: record and recheck'
          results = {'base': base, 'published': published, 'changed_files': sorted(changed), 'unchanged_files': len(before) - len(changed), 'live': []}
          for path, sha in expected.items():
              raw = base64.b64decode(api('/git/blobs/' + sha)['content'])
              text = raw.decode('utf-8')
              match = re.search(r'<link\s+rel="canonical"\s+href="([^"]+)"', text)
              assert match, path
              url = match.group(1)
              assert url.startswith('https://tinnitusbioregulation.com/pt/')
              result = {'path': path, 'url': url, 'expected_blob': sha}
              for attempt in range(8):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (translation-release-verification)', 'Cache-Control': 'no-cache', 'Accept-Encoding': 'identity'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          body = response.read()
                          result.update({'status': response.status, 'content_type': response.headers.get('Content-Type'), 'final_url': response.url, 'etag': response.headers.get('ETag'), 'request_id': response.headers.get('X-Nf-Request-Id'), 'attempts': attempt + 1})
                      live_sha = hashlib.sha1(b'blob ' + str(len(body)).encode() + b'\0' + body).hexdigest()
                      result['received_blob'] = live_sha
                      result['byte_exact'] = body == raw
                      result['sha256'] = hashlib.sha256(body).hexdigest()
                      target = out / 'live' / path; target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(body)
                      if result['status'] == 200 and result['byte_exact']: break
                  except Exception as exc:
                      result['error'] = str(exc)
                  time.sleep(7)
              results['live'].append(result)
              (out / 'verification.json').write_text(json.dumps(results, ensure_ascii=False, indent=2))
              print(path + ' HTTP=' + str(result.get('status')) + ' EXACT=' + str(result.get('byte_exact')), flush=True)
          assert all(r.get('status') == 200 and r.get('byte_exact') for r in results['live']), 'Live mismatch: inspect verification artifact'
          print('SUCCESS: all 11 live pages match approved HTML byte-for-byte; all other repository blobs unchanged.', flush=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pt-eu-live-verification-${{ github.run_id }}
          path: verification/
          retention-days: 30

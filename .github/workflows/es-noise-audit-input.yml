name: Build Spanish noise page audit input

on:
  push:
    branches:
      - review/es-laerm-2026-08-31

permissions:
  contents: write

jobs:
  bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/es-laerm-2026-08-31
          fetch-depth: 0
      - name: Collect exact audit inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, shutil, subprocess

          out = Path('audit-input')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir()

          files = [
              'laermbedingter-tinnitus.html',
              'es/acufenos-por-ruido.html',
              'site.css',
              'site.js',
              'favicon.ico',
              'favicon.svg',
              'site.webmanifest',
          ]

          html_paths = [Path(files[0]), Path(files[1])]
          refs = set()
          for hp in html_paths:
              text = hp.read_text(encoding='utf-8')
              for attr in ('src', 'href'):
                  for value in re.findall(rf'{attr}="([^"]+)"', text):
                      if value.startswith(('http://', 'https://', '#', 'mailto:', 'tel:', 'javascript:')):
                          continue
                      clean = value.split('?', 1)[0].split('#', 1)[0]
                      candidate = (hp.parent / clean).resolve()
                      try:
                          rel = candidate.relative_to(Path.cwd().resolve())
                      except ValueError:
                          continue
                      if rel.is_file() and (str(rel).lower().endswith(('.webp','.png','.jpg','.jpeg','.svg','.gif'))):
                          refs.add(rel.as_posix())
          files.extend(sorted(refs))

          for rel in files:
              src = Path(rel)
              if not src.exists():
                  continue
              dst = out / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)

          (out / 'SOURCE_COMMIT.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'], text=True), encoding='utf-8')
          (out / 'FILELIST.txt').write_text('\n'.join(sorted(str(p.relative_to(out)) for p in out.rglob('*') if p.is_file())) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: es-noise-audit-input
          path: audit-input
          if-no-files-found: error
          retention-days: 7
      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/es-noise-audit-input.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/es-noise-audit-input.yml
          git commit -m "Remove Spanish noise audit input workflow"
          git push origin HEAD:review/es-laerm-2026-08-31

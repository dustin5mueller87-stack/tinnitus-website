name: Patch verified Arabic experience report findings
on:
  push:
    branches: [arabic-translation-fixes-2026-09-07]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch experience report page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('ar/erfahrungsberichte.html'); s=p.read_text(encoding='utf-8')
          pattern=r'<p>أجمع هنا تقارير تجارب متاحة للعامة وجدتها أثناء بحثي عبر لغات ومنتديات ومنصات مختلفة\..*?</p>'
          new='<p>أجمع هنا تقارير تجارب متاحة للعامة وجدتها أثناء بحثي عبر لغات ومنتديات ومنصات مختلفة. وهي تُظهر أن أشخاصًا في أنحاء العالم، كلٌّ منهم بصورة مستقلة عن الآخرين ومن دون أن يعرف بعضهم بعضًا، يروون تجارب متشابهة مع طنين الأذن ونهج قائم على المغذيات. ولا يمكن الحكم عن بُعد على ما تُحدثه هذه المنشورات بالضبط في كل حالة على حدة؛ وعليك أن تقرر بنفسك ما رأيك فيها.</p>'
          s,n=re.subn(pattern,new,s,count=1,flags=re.S)
          s=s.replace('تقرير عن جارة (رنين الأذن)','تقرير عن جارة (طنين الأذن)')
          s=s.replace('جارة لديها ارتفاع في ضغط الدم ورنين في الأذن.','جارة لديها ارتفاع في ضغط الدم وطنين الأذن.')
          if n!=1: raise SystemExit('intro match failed')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/patch-ar-experiences.yml
          git add ar/erfahrungsberichte.html
          git config user.name arabic-translation-fix-bot
          git config user.email arabic-translation-fix-bot@users.noreply.github.com
          git commit -m "Fix verified Arabic experience-report issues"
          git push origin HEAD:arabic-translation-fixes-2026-09-07

          p='ar/stressbedingter-tinnitus.html'
          rep(p,'<p>بلغ بي اليأس حدّ أنني لم أرد أن أترك شيئًا من دون أن أجرّبه. وما ساعدني آنذاك لم يكن دواءً ولا علاجًا تقليديًا، بل العمل مع <span lang="de" dir="ltr">Heilpraktiker</span> (ممارس غير طبي وفق المسمى المهني الألماني) ومحاضر يُدعى <bdi dir="ltr">Michael Prgomet</bdi>، وهو يتناول منذ أكثر من <bdi dir="ltr">30</bdi> عامًا الآليات نفسها التي تدور حولها هذه الصفحة. ولم يكن إلا عمله هو ما ساعدني إلى حدّ كبير على حل صراعات مرحلتي مع متلازمة التعب المزمن والأعراض النفسية الجسدية بالكامل وإعادة جهازي العصبي الذاتي إلى التوازن.</p>','<p>بلغ بي اليأس حدّ أنني لم أرد أن أترك شيئًا من دون أن أجرّبه. وما ساعدني آنذاك لم يكن دواءً ولا علاجًا تقليديًا، بل العمل مع معالج غير طبيب (<span lang="de" dir="ltr">Heilpraktiker</span>) ومحاضر يُدعى <bdi dir="ltr">Michael Prgomet</bdi>، وهو يتناول منذ أكثر من <bdi dir="ltr">30</bdi> عامًا الآليات نفسها التي تدور حولها هذه الصفحة.</p>\n  <p>ولم يساعدني آنذاك على حلّ هذه التوترات الداخلية العميقة شيئًا فشيئًا إلا عمله.</p>')

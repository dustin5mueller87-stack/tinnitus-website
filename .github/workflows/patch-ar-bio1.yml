name: Patch verified Arabic Bio 1 findings
on:
  push:
    branches: [arabic-translation-fixes-2026-09-07]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Bio 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ar/meine-geschichte-teil-1.html'); s=p.read_text(encoding='utf-8')
          R=[
          ('وفي اليمنى كنت أسمع في ذلك الوقت بالفعل صفيرًا ضعيفًا.','أما في الأذن اليمنى، فلم أكن أسمع طنينًا في ذلك الوقت.'),
          ('وحتى الصفير الضعيف الموجود أصلًا في الأذن اليمنى أصبح الآن أعلى بوضوح.','وفي الأذن اليمنى سمعت الآن طنينًا للمرة الأولى.'),
          ('كان نظامي قد «سُلق حتى صار رخوًا» منذ زمن، قبل أن يأتي صوت الجهير في الملهى الليلي.','كان نظامي منهكًا منذ زمن، قبل أن يأتي صوت الجهير في الملهى الليلي.'),
          ('كان النظام قد «سُلق حتى صار رخوًا» من دون أن أعرف.','كان نظامي منهكًا أصلًا، من دون أن أعرف.'),
          ('سأفك شفرة طنين الأذن لدي','سأتغلّب على طنين الأذن لديّ'),
          ('القشة الأخيرة: تصحيح فقرة الأطلس.','آخر أمل: تصحيح فقرة الأطلس.'),
          ('وعلى أذنيّ ضمادات شاش سميكة','وفي كلتا أذنيّ ضمادات شاش سميكة'),
          ('يحمل نتيجة قياس السمع','يحمل في يده نتيجة قياس السمع بالنغمات'),
          ('أنني أتوهّم كل شيء','أن عقلي يعبث بي'),
          ('فقد أستطيع رفع <bdi dir="ltr">ATP</bdi> من خلال مغذيات محددة.','يمكنني رفع <bdi dir="ltr">ATP</bdi> من خلال مغذيات محددة.'),
          ('كانت قيمتي منخفضة جدًا ضمن المجال الطبيعي، وبفارق ضئيل فقط فوق عتبة النقص الحقيقي، لكن الفحص لم يثبت وجود نقص فعلي.','كانت قيمتي لا تزال ضمن المجال الطبيعي، نعم، لكنها كانت في أدنى ذلك المجال، أعلى بقليل من عتبة النقص.'),
          ('كانت قيمتي منخفضة جدًا ضمن المجال الطبيعي، وبفارق ضئيل فقط فوق عتبة نقص حقيقي، لكن النتيجة لم تثبت وجود نقص فعلي.','كانت قيمتي لا تزال ضمن المجال الطبيعي، نعم، لكنها كانت في أدنى ذلك المجال، أعلى بقليل من عتبة النقص.'),
          ('وكان <bdi dir="ltr">B12</bdi>، وفق ذلك النموذج، أهم فيتامين على الإطلاق لتجدد غمد الميالين.','وبحسب ما قرأته، كان <bdi dir="ltr">B12</bdi> أهم فيتامين على الإطلاق لتجدد غمد الميالين.')]
          n=0
          for a,b in R:
              c=s.count(a); print(c,a[:55]); s=s.replace(a,b); n+=c
          if not n: raise SystemExit('no Bio1 matches')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/patch-ar-bio1.yml
          git add ar/meine-geschichte-teil-1.html
          git config user.name arabic-translation-fix-bot
          git config user.email arabic-translation-fix-bot@users.noreply.github.com
          git commit -m "Fix verified Arabic Bio 1 translation issues"
          git push origin HEAD:arabic-translation-fixes-2026-09-07

name: Restore Spanish biography part 2 page structure

on:
  push:
    branches:
      - review/es-biografie-teil-2-2026-08-31

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/es-biografie-teil-2-2026-08-31
          fetch-depth: 0

      - name: Apply exact reviewed structure
        run: python .audit-tmp/es-bio2-restore.py

      - name: Commit only the reviewed page and remove temporary files
        shell: bash
        run: |
          rm -rf .audit-tmp .github/workflows/es-bio2-restore-structure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' .audit-tmp/es-bio2-final.part0 .audit-tmp/es-bio2-restore.py .github/workflows/es-bio2-restore-structure.yml es/mi-historia-parte-2.html | sort)"
          if [ "$changed" != "$expected" ]; then
            printf 'Unexpected staged paths:\n%s\n' "$changed"
            exit 1
          fi
          git commit -m "Preserve Spanish biography part 2 page structure"
          git push origin HEAD:review/es-biografie-teil-2-2026-08-31

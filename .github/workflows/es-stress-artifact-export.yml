name: Wait for and export Spanish stress audit artifact

on:
  push:
    branches:
      - export/es-stress-2026-08-31

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: export/es-stress-2026-08-31
          fetch-depth: 0

      - name: Wait for the completed genuine audit artifact
        shell: bash
        run: |
          ARTIFACT_ID=""
          for i in $(seq 1 300); do
            ARTIFACT_ID="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name=="ES_Stress_Pruefkoffer_2026-08-31" and .expired==false and .workflow_run.head_branch=="review/es-stress-2026-08-31")] | sort_by(.created_at) | last | .id // empty')"
            if [ -n "$ARTIFACT_ID" ]; then
              echo "Found artifact $ARTIFACT_ID"
              break
            fi
            echo "Audit artifact not ready yet, attempt $i/300"
            sleep 60
          done
          test -n "$ARTIFACT_ID"
          echo "ARTIFACT_ID=$ARTIFACT_ID" >> "$GITHUB_ENV"

      - name: Download and unpack the completed artifact
        shell: bash
        run: |
          rm -rf /tmp/es-stress-export
          mkdir -p /tmp/es-stress-export/outer /tmp/es-stress-export/content
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/es-stress-export/outer.zip
          unzip -q /tmp/es-stress-export/outer.zip -d /tmp/es-stress-export/outer
          find /tmp/es-stress-export/outer -type f -printf '%p\n' | sort
          cp -a /tmp/es-stress-export/outer/. /tmp/es-stress-export/content/
          test -f /tmp/es-stress-export/content/ES_Stress_Pruefkoffer_2026-08-31.zip
          test -f /tmp/es-stress-export/content/ES_Stress_Pruefkoffer_2026-08-31.zip.sha256
          (cd /tmp/es-stress-export/content && sha256sum -c ES_Stress_Pruefkoffer_2026-08-31.zip.sha256)

      - name: Commit a stable export without touching the website branch
        shell: bash
        run: |
          git fetch origin main
          git checkout -B export/es-stress-2026-08-31 origin/main
          rm -rf audit-export/es-stress-2026-08-31
          mkdir -p audit-export/es-stress-2026-08-31
          cp -a /tmp/es-stress-export/content/. audit-export/es-stress-2026-08-31/
          rm -f .github/workflows/es-stress-artifact-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-export/es-stress-2026-08-31 .github/workflows/es-stress-artifact-export.yml
          git commit -m "Export completed Spanish stress-page audit package"
          git push --force-with-lease origin HEAD:export/es-stress-2026-08-31

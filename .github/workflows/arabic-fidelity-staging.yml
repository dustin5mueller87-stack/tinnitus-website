name: Arabic fidelity staging
on:
  push:
    branches: [automation/ar-fidelity-20260917]
    paths: [.github/workflows/arabic-fidelity-staging.yml]
permissions:
  contents: read
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify live Arabic HTML without images or browser resources
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime,difflib,hashlib,json,os,pathlib,urllib.request
          api='https://api.github.com/repos/'+os.environ['REPOSITORY']
          release='459a5ea49272243673a7528c0f4a89c4ab0904d0'
          base='5eac5df84380001f3d83c1aefc93615dd1edb11c'
          expected={'ar/index.html':'4dbcf269619bd1287f6a6c65920cba29aa13cf26','ar/tinnitus-geheilt-erfahrungsbericht.html':'1304aa9bbf97095496c07d2cfb8976ba4aff9f82','ar/meine-geschichte-teil-1.html':'b1d7413e68367f10ae85b3e6a366696329a72c00','ar/meine-geschichte-teil-2.html':'6f2c813e21f32e1547b7c12311b51438cc0c7c8a','ar/laermbedingter-tinnitus.html':'4c01ed6981c1421fa48a2b5e310d65957714254f','ar/mein-loesungsansatz.html':'affcf0fbc4d12a492557cf70818ae13b416ecb26','ar/wissenschaftliche-quellen.html':'d76adaed6a60abf2c6126cc18a0dc84a8839683b','ar/erfahrungsberichte.html':'75653f316e703b1afe80d7ff623a49a3b0287efa','ar/produkte.html':'04e7fc83e421b77006d62a8f2d40393d7ac4c978','ar/stressbedingter-tinnitus.html':'966bac9fe98e22969d702f87405a21f2ba778f22','ar/medikamente-gifte-tinnitus.html':'1ecf4e98ab4f3e627b26515202362f879c222506','ar/faq.html':'f5c4f9308f1829f4608fbcc5a00260cad5b5ec1c'}
          def get_api(route):
              req=urllib.request.Request(api+route,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          def tree(ref):
              result=get_api('/git/trees/'+ref+'?recursive=1')
              assert not result['truncated']
              return {e['path']:(e['sha'],e['mode'],e['type']) for e in result['tree'] if e['type']!='tree'}
          before=tree(base); after=tree(release)
          changed={p for p in before.keys()|after.keys() if before.get(p)!=after.get(p)}
          assert changed==set(expected), 'Unexpected publication paths'
          assert all(after[p][0]==sha for p,sha in expected.items())
          result={'release_commit':release,'previous_main':base,'verified_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'changed_paths':sorted(changed),'all_other_repository_files_unchanged':True,'unchanged_file_count':len(before)-len(changed),'images_requested':0,'files':[]}
          root=pathlib.Path('live-verification');root.mkdir()
          for path,sha in expected.items():
              route='/ar/' if path=='ar/index.html' else '/'+path[:-5]
              url='https://tinnitusbioregulation.com'+route
              row={'path':path,'url':url,'expected_blob':sha}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'ArabicFidelityReleaseVerification/1.0','Accept':'text/html','Accept-Encoding':'identity','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      data=r.read();row.update(status=r.status,content_type=r.headers.get('Content-Type'),final_url=r.url)
                  data.decode('utf-8')
                  actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  row.update(actual_blob=actual,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),exact_match=actual==sha)
                  if actual!=sha:
                      (root/(path.replace('/','_'))).write_bytes(data)
              except Exception as e:
                  row.update(exact_match=False,error=type(e).__name__+': '+str(e))
              result['files'].append(row);print(json.dumps(row,ensure_ascii=False))
          result['all_live_files_exact_match']=all(r['exact_match'] and r.get('status')==200 for r in result['files'])
          result['main_at_verification']=get_api('/git/ref/heads/main')['object']['sha']
          (root/'live-verification.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          assert result['all_live_files_exact_match'], 'Live output differs: inspect artifact; do not claim exact verification'
          print('All 12 live pages match the approved files byte for byte. Other repository files unchanged.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: arabic-live-verification
          path: live-verification
          retention-days: 14
          if-no-files-found: error

name: Astra Turkish translation publication

on:
  push:
    branches:
      - astra-turkish-translation-fixes-2026-09-07
    paths:
      - .github/workflows/astra-turkish-publish.yml

permissions:
  contents: write

jobs:
  apply-audited-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated publication branch
        uses: actions/checkout@v4
        with:
          ref: astra-turkish-translation-fixes-2026-09-07
          fetch-depth: 0

      - name: Apply exact audited Turkish corrections
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          exec(gzip.decompress(base64.b64decode(payload)).decode('utf-8'), {'__name__': '__main__'})
          PY

      - name: Verify patch is clean and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/astra-turkish-publish.yml
          git diff --check
          git status --short

      - name: Commit only audited publication changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply audited Turkish translation fixes"
          git push origin HEAD:astra-turkish-translation-fixes-2026-09-07

          from pathlib import Path

          failures = []
          touched = set()

          def repl(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              n = text.count(old)
              if n != expected:
                  failures.append(f"{path}: expected {expected} occurrence(s), found {n}: {old[:120]!r}")
                  return
              p.write_text(text.replace(old, new, expected), encoding='utf-8')
              touched.add(path)

          def remove(path, old, expected=1):
              repl(path, old, '', expected)


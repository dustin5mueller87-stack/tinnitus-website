name: Build Spanish approach page audit input

on:
  push:
    branches:
      - review/es-enfoque-2026-09-01

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/es-enfoque-2026-09-01
          fetch-depth: 0

      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4==4.13.5

      - name: Collect exact page inputs
        shell: bash
        run: |
          rm -rf /tmp/es-approach-input
          mkdir -p /tmp/es-approach-input/pages /tmp/es-approach-input/assets /tmp/es-approach-input/repo-assets
          cp mein-loesungsansatz.html /tmp/es-approach-input/pages/de.html
          cp es/mi-enfoque.html /tmp/es-approach-input/pages/es.html
          cp site.css site.js favicon.svg site.webmanifest /tmp/es-approach-input/assets/ 2>/dev/null || true
          git rev-parse HEAD > /tmp/es-approach-input/SOURCE_COMMIT.txt
          git hash-object mein-loesungsansatz.html > /tmp/es-approach-input/DE_BLOB.txt
          git hash-object es/mi-enfoque.html > /tmp/es-approach-input/ES_BLOB.txt
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re, shutil

          root = Path('.').resolve()
          out = Path('/tmp/es-approach-input/repo-assets')
          refs = set()
          for page_rel in [Path('mein-loesungsansatz.html'), Path('es/mi-enfoque.html')]:
              page = root / page_rel
              raw = page.read_text(encoding='utf-8')
              soup = BeautifulSoup(raw, 'html.parser')
              for tag in soup.find_all(True):
                  for attr in ('src','href','content','data-lightbox-src'):
                      val = tag.get(attr)
                      if not val or val.startswith(('http://','https://','#','mailto:','tel:','data:','javascript:')):
                          continue
                      clean = val.split('#',1)[0].split('?',1)[0]
                      if not clean:
                          continue
                      p = (page.parent / clean).resolve()
                      try:
                          rel = p.relative_to(root)
                      except ValueError:
                          continue
                      if p.is_file():
                          refs.add(rel)
              for m in re.finditer(r'https://tinnitusbioregulation\.com/([^"\'\s<>]+)', raw):
                  rel = Path(m.group(1).split('?',1)[0].split('#',1)[0])
                  if (root / rel).is_file():
                      refs.add(rel)
          for rel in sorted(refs):
              dest = out / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(root / rel, dest)
          Path('/tmp/es-approach-input/REFERENCED_ASSETS.txt').write_text('\n'.join(map(str, sorted(refs))), encoding='utf-8')
          PY
          find /tmp/es-approach-input -type f -printf '%P\t%s bytes\n' | sort > /tmp/es-approach-input/MANIFEST.txt

      - uses: actions/upload-artifact@v4
        with:
          name: es-approach-audit-input
          path: /tmp/es-approach-input
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/es-approach-audit-input.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Spanish approach audit input workflow"
          git push origin HEAD:review/es-enfoque-2026-09-01

name: Astra Turkish final cleanup

on:
  push:
    branches:
      - astra-turkish-translation-fixes-2026-09-07
    paths:
      - .github/workflows/astra-turkish-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-turkish-translation-fixes-2026-09-07
          fetch-depth: 0
      - name: Apply final guarded cleanup
        run: |
          python .astra-tr-final.py
          rm .astra-tr-final.py
          rm .github/workflows/astra-turkish-finalize.yml
          git diff --check
          git status --short
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize audited Turkish translation fixes"
          git push origin HEAD:astra-turkish-translation-fixes-2026-09-07

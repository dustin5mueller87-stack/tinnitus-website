name: Patch verified Arabic noise page chronology
on:
  push:
    branches: [arabic-translation-fixes-2026-09-07]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chronology
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ar/laermbedingter-tinnitus.html'); s=p.read_text(encoding='utf-8')
          pairs=[
            ('وزاد الطين بلة أن صفيرًا خافتًا كان قد ظهر بالفعل أيضًا في أذني اليمنى في اليوم <bdi dir="ltr">3</bdi>. وبعد ذلك بوقت قصير، اشتدت هذه النغمة الموجودة أصلًا في الأذن اليمنى بوضوح – كنتيجة مباشرة لتعليمات الأطباء التي تبيّن لي شخصيًا أنها خاطئة تمامًا.','وزاد الطين بلة أن الأذن اليمنى انضمّت بعد ذلك بوقت قصير أيضًا – كنتيجة مباشرة لتعليمات الأطباء التي تبيّن لي شخصيًا أنها خاطئة تمامًا.'),
            ('وبالنظر إلى الأمر لاحقًا، كان ذلك أحد أكبر الأخطاء، لأن حالتي ساءت بسببه تحديدًا، واشتدت النغمة الخافتة الموجودة أصلًا في الأذن اليمنى بوضوح.','وبالنظر إلى الأمر لاحقًا، كان ذلك أحد أكبر الأخطاء، لأن حالتي ساءت بسببه تحديدًا، وانجرّت الأذن الثانية إلى المشكلة أيضًا.')]
          n=0
          for a,b in pairs:
              c=s.count(a); print(c); s=s.replace(a,b); n+=c
          if n!=2: raise SystemExit(f'unexpected matches: {n}')
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git rm .github/workflows/patch-ar-noise-history.yml
          git add ar/laermbedingter-tinnitus.html
          git config user.name arabic-translation-fix-bot
          git config user.email arabic-translation-fix-bot@users.noreply.github.com
          git commit -m "Fix Arabic noise-page chronology"
          git push origin HEAD:arabic-translation-fixes-2026-09-07

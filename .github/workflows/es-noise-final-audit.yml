name: Final focused Arsenal audit for Spanish noise page

on:
  push:
    branches:
      - review/es-laerm-v2-2026-08-31

permissions:
  contents: write
  actions: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      MODEL: /tmp/qwen2.5-3b-instruct-q4_k_m.gguf
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/es-laerm-v2-2026-08-31
          fetch-depth: 0

      - name: Prepare exact page and Arsenal environment
        shell: bash
        run: |
          python -m pip install --quiet --upgrade 'llama-cpp-python==0.3.16' --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -m pip install --quiet 'beautifulsoup4==4.13.5' 'lxml==6.0.1'
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip imagemagick tesseract-ocr tesseract-ocr-spa tesseract-ocr-deu tesseract-ocr-eng
          rm -rf /tmp/es-noise-input
          mkdir -p /tmp/es-noise-input
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9741668827/zip > /tmp/es-noise-input/input.zip
          unzip -q /tmp/es-noise-input/input.zip -d /tmp/es-noise-input/artifact
          curl -fL --retry 8 --retry-all-errors 'https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf?download=true' -o "$MODEL"
          test "$(stat -c%s "$MODEL")" -gt 1000000000

      - name: Perform complete page audit and correction
        shell: bash
        run: |
          cat > /tmp/final-audit.py <<'PY'
          from __future__ import annotations
          import csv, difflib, hashlib, html, json, os, re, shutil, subprocess, zipfile
          from pathlib import Path
          from bs4 import BeautifulSoup, Tag
          from llama_cpp import Llama

          root=Path.cwd(); de_path=root/'laermbedingter-tinnitus.html'; es_path=root/'es/acufenos-por-ruido.html'
          de_raw=de_path.read_text(encoding='utf-8'); es_original=es_path.read_text(encoding='utf-8')
          out=root/'audit/es-laerm'; shutil.rmtree(out,ignore_errors=True); out.mkdir(parents=True)
          input_root=Path('/tmp/es-noise-input')

          # Unpack and read every text-bearing Arsenal file.
          for z in list(input_root.rglob('*.zip')):
              try:
                  with zipfile.ZipFile(z) as f:
                      if any(re.search(r'arsenal|brill|stimm|meaning|master|span',n,re.I) for n in f.namelist()):
                          d=input_root/'arsenal-unpacked'/z.stem;d.mkdir(parents=True,exist_ok=True);f.extractall(d)
              except Exception:pass
          exts={'.md','.txt','.json','.csv','.html','.yaml','.yml'}; arsenal=[];seen=set()
          for p in sorted(input_root.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in exts:continue
              if not re.search(r'arsenal|brill|stimm|meaning|master|spanisch|fehler|fortsetz|regel|übersetz|uebersetz',p.as_posix(),re.I):continue
              s=p.read_text(encoding='utf-8',errors='replace').strip();h=hashlib.sha256(s.encode()).hexdigest()
              if not s or h in seen:continue
              seen.add(h);arsenal.append((p.as_posix(),s))
          if not arsenal:raise SystemExit('Arsenal not found')
          (out/'arsenal_manifest.json').write_text(json.dumps([{'file':n,'chars':len(s),'sha256':hashlib.sha256(s.encode()).hexdigest()} for n,s in arsenal],ensure_ascii=False,indent=2),encoding='utf-8')

          # Extract binding and language-specific rules deterministically from all files.
          norm=re.compile(r'\b(muss|müssen|darf|dürfen|verbot|niemals|immer|keine|kein |nicht |zwingend|verbindlich|autor|medizin|recht|ursach|zahl|zeit|modal|stimm|stil|idiom|german|bild|alt.text|seo|rückübers|hinzuf|weglass|spanisch|español)\b',re.I)
          candidates=[]
          for name,body in arsenal:
              file_priority=4 if re.search(r'brill|stimm|voice|meaning|master|spanisch|fehler|autor|regel',name,re.I) else 0
              for para in re.split(r'\n\s*\n|(?<=[.!?])\s+(?=[A-ZÄÖÜ])',body):
                  t=re.sub(r'\s+',' ',para).strip()
                  if not t:continue
                  score=file_priority+(4 if norm.search(t) else 0)
                  if score>=4:candidates.append((score,name,t))
          chosen=[];seen_rule=set();chars=0
          for score,name,t in sorted(candidates,key=lambda x:(-x[0],x[1])):
              k=re.sub(r'\W+','',t.lower())[:240]
              if k in seen_rule:continue
              line=f'- [{Path(name).name}] {t}'
              if chars+len(line)>39000:continue
              chosen.append((name,t));seen_rule.add(k);chars+=len(line)+1
          rules='\n'.join(f'- [{Path(n).name}] {t}' for n,t in chosen)
          (out/'arsenal_bindende_regeln.txt').write_text(rules,encoding='utf-8')

          llm=Llama(model_path=os.environ['MODEL'],n_ctx=32768,n_threads=max(2,(os.cpu_count() or 4)-1),n_batch=768,n_gpu_layers=0,verbose=False)
          def ask(prompt,max_tokens=4800):
              r=llm.create_chat_completion(messages=[
                {'role':'system','content':'Du bist Senior-Prüfer für Deutsch und Spanisch. Deutsche Referenz plus verbindliches Arsenal sind bindend. Keine medizinischen, rechtlichen oder persönlichen Eigenumschreibungen. Keine Zusätze, Auslassungen, Verstärkungen oder Abschwächungen. Dustins Stimme bleibt direkt, rau, bildhaft und persönlich. Neutral-panhispanisches, idiomatisches Spanisch mit tú. Nur echte Fehler korrigieren.'},
                {'role':'user','content':prompt}],temperature=.03,top_p=.82,max_tokens=max_tokens,response_format={'type':'json_object'})
              s=r['choices'][0]['message']['content']
              try:return json.loads(s)
              except Exception:
                  m=re.search(r'\{.*\}',s,re.S)
                  if not m:raise
                  return json.loads(m.group())

          def split(raw):
              s=BeautifulSoup(raw,'html.parser');main=s.main;res={}
              global_html=str(s.head)+'\n'+str(s.body.find('header'))+'\n'+str(s.body.find('footer'))
              for c in s.body.children:
                  if isinstance(c,Tag) and c is not main and c.name not in {'header','footer'}:global_html+='\n'+str(c)
              res['GLOBAL']=global_html;pre=[];secs=[];cur=None
              for c in [x for x in main.children if isinstance(x,Tag)]:
                  if c.name=='h2':cur=[str(c)];secs.append(cur)
                  elif cur is None:pre.append(str(c))
                  else:cur.append(str(c))
              res['PRELUDE']='\n'.join(pre)
              for i,x in enumerate(secs,1):res[f'SECTION_{i:02d}']='\n'.join(x)
              return res
          de=split(de_raw);es=split(es_original);keys=list(dict.fromkeys([*de,*es]));groups=[];g=[];n=0
          for k in keys:
              size=len(de.get(k,''))+len(es.get(k,''))
              if g and n+size>23500:groups.append(g);g=[];n=0
              g.append(k);n+=size
          if g:groups.append(g)

          schema='{"issues":[{"area":"Ort","severity":"critical|major|medium|minor","category":"omission|addition|meaning|causality|certainty|number|chronology|voice|idiom|grammar|seo|technical|other","german_source":"Deutsch mit Kontext","current_spanish":"Spanisch aktuell","current_spanish_de":"deutsche Bedeutung aktuell","problem_de":"einfache Begründung","corrected_spanish":"neues Spanisch","corrected_spanish_de":"natürliche deutsche Rückübersetzung in Dustins Stimme","exact_old":"exakter einmaliger HTML-Substring","exact_new":"exakter Ersatz mit Tags","confidence":0.0}]}'
          issues=[]
          for i,group in enumerate(groups,1):
              body=''
              for k in group:body+=f'\n######## {k} ########\nDEUTSCH:\n{de.get(k,"[FEHLT]")}\nSPANISCH:\n{es.get(k,"[FEHLT]")}\n'
              p=f'''BINDENDE ARSENALREGELN:\n{rules}\n\nPrüfe Gruppe {i}/{len(groups)} atomar, Wort für Wort, Satz für Satz, Textblock für Textblock. Prüfe auch Head, SEO, Navigation, Alt, Lightbox, ARIA, Footer und Runtime-Texte, soweit enthalten. Melde ausschließlich belegbare Fehler, keine kosmetischen Vorlieben. exact_old muss wortwörtlich einmalig im spanischen HTML stehen, exact_new bewahrt Tags und Links. Ausgabe ausschließlich JSON nach Schema:\n{schema}\n\n{body}'''
              data=ask(p,4800)
              for x in data.get('issues',[]):x['group']=i;issues.append(x)
          (out/'issues_first_pass.json').write_text(json.dumps(issues,ensure_ascii=False,indent=2),encoding='utf-8')

          # Schiedsprüfung in small batches, with lower context and high precision.
          final=[]
          compact_rules='\n'.join(rules.splitlines()[:220])
          for start in range(0,len(issues),10):
              batch=issues[start:start+10]
              p=f'''Unabhängige Schlussprüfung. Verwerfe Geschmackskosmetik, sterile Glättung, neue Fachwörter und Änderungen, die Dustins Stimme schwächen. Akzeptiere nur einen klaren Verstoß gegen Referenz/Arsenal. Revidiere eine stilistisch schwache Korrektur in idiomatisches, direktes Spanisch.\nARSENAL:\n{compact_rules}\nKANDIDATEN:\n{json.dumps(batch,ensure_ascii=False)}\nJSON: {{"decisions":[{{"index":0,"decision":"accept|revise|reject","reason_de":"warum","exact_old":"exakt","exact_new":"exakt","corrected_spanish":"sichtbar","corrected_spanish_de":"natürliche deutsche Rückübersetzung","confidence":0.0}}]}}'''
              data=ask(p,4200)
              for d in data.get('decisions',[]):
                  try:x=dict(batch[int(d['index'])])
                  except Exception:continue
                  x.update({k:v for k,v in d.items() if k!='index'});final.append(x)
          (out/'issues_adjudicated.json').write_text(json.dumps(final,ensure_ascii=False,indent=2),encoding='utf-8')

          corrected=es_original;applied=[];rejected=[];open_items=[]
          for x in final:
              if x.get('decision')=='reject':rejected.append(x);continue
              old=str(x.get('exact_old',''));new=str(x.get('exact_new',''))
              try:conf=float(x.get('confidence',0))
              except:conf=0
              count=corrected.count(old) if old else 0
              if conf<.88 or not old or not new or old==new or count!=1:
                  x['apply_error']=f'confidence={conf}; occurrences={count}';open_items.append(x);continue
              corrected=corrected.replace(old,new,1);applied.append(x)
          es_path.write_text(corrected,encoding='utf-8',newline='\n')

          # Hard structural gate.
          soup=BeautifulSoup(corrected,'html.parser');errs=[]
          if not soup.html or soup.html.get('lang')!='es':errs.append('lang')
          ids=[x.get('id') for x in soup.find_all(id=True)]
          if len(ids)!=len(set(ids)):errs.append('duplicate ids')
          anchors={a.get('href','')[1:] for a in soup.find_all('a',href=True) if a.get('href','').startswith('#')}
          if not anchors.issubset(set(ids)):errs.append('missing anchors')
          for s in soup.find_all('script',attrs={'type':'application/ld+json'}):
              try:json.loads(s.string or s.get_text())
              except Exception as e:errs.append('jsonld '+str(e))
          images=[]
          for img in soup.find_all('img'):
              p=(es_path.parent/img.get('src','')).resolve();images.append((img,p))
              if not p.exists():errs.append('missing image '+img.get('src',''))
              if not img.get('alt','').strip():errs.append('missing alt '+img.get('src',''))
          if any('noindex' in m.get('content','').lower() for m in soup.find_all('meta',attrs={'name':'robots'})):errs.append('noindex')
          if errs:
              es_path.write_text(es_original,encoding='utf-8',newline='\n');raise SystemExit('; '.join(errs))

          def units(raw,lang):
              s=BeautifulSoup(raw,'html.parser');rows=[]
              def add(area,kind,text):
                  t=re.sub(r'\s+',' ',html.unescape(str(text))).strip()
                  if t:rows.append({'lang':lang,'area':area,'kind':kind,'text':t})
              add('head','title',s.title.get_text(' ',strip=True) if s.title else '')
              for m in s.find_all('meta'):
                  key=m.get('name') or m.get('property')
                  if key in {'description','og:title','og:description','twitter:title','twitter:description'}:add('head',key,m.get('content',''))
              for t in s.find_all(['h1','h2','h3','p','li']):add('main' if t.find_parent('main') else 'chrome',t.name,t.get_text(' ',strip=True))
              for t in s.find_all(['img','a','button','summary','nav']):
                  for a in ['alt','data-lightbox','aria-label','title']:
                      if t.has_attr(a):add('attribute',t.name+'@'+a,t.get(a,''))
              return rows
          du=units(de_raw,'de');before=units(es_original,'es_before');after=units(corrected,'es_after');mx=max(len(du),len(before),len(after))
          with (out/'ES_Laerm_Blockmatrix_2026-08-31.csv').open('w',encoding='utf-8-sig',newline='') as f:
              w=csv.DictWriter(f,fieldnames=['index','de_area','de_kind','de_text','es_before','es_after','status']);w.writeheader()
              for i in range(mx):
                  d=du[i] if i<len(du) else {};b=before[i] if i<len(before) else {};a=after[i] if i<len(after) else {}
                  w.writerow({'index':i+1,'de_area':d.get('area',''),'de_kind':d.get('kind',''),'de_text':d.get('text',''),'es_before':b.get('text',''),'es_after':a.get('text',''),'status':'corrected' if b.get('text')!=a.get('text') else 'unchanged'})

          image_report=['# Bildprüfung: Spanisch, lärmbedingter Tinnitus','']
          for img,p in images:
              image_report += [f'## `{img.get("src","")}`',f'- Vorhanden: {"ja" if p.exists() else "nein"}',f'- Alt-Text: {img.get("alt","")}']
              par=img.find_parent('a')
              if par and par.get('data-lightbox'):image_report.append('- Lightbox: '+par.get('data-lightbox'))
              try:image_report.append('- Technisch: '+subprocess.check_output(['identify','-format','%m %wx%h %b',str(p)],text=True).strip())
              except:pass
              try:ocr=subprocess.check_output(['tesseract',str(p),'stdout','-l','spa+deu+eng','--psm','11'],text=True,stderr=subprocess.DEVNULL)
              except:ocr=''
              image_report.append('- OCR-Kontrolle eingebetteter Texte: '+(re.sub(r'\s+',' ',ocr).strip() or 'kein verlässlich erkennbarer Text'));image_report.append('')
          try:
              wf=subprocess.check_output(['git','show','74c3e71e9d399453de65e5982a54a394ce1a5617:.github/workflows/es-noise-image-fix.yml'],text=True)
              (out/'Kaskadenbild_Korrekturcode.txt').write_text(wf,encoding='utf-8')
              image_report += ['## Kaskaden-Grafik','Zwei eingebettete spanische Beschriftungen waren gegenüber der deutschen Grafik inhaltlich verschoben. Beide sind auf diesem Branch bereits exakt korrigiert; der reproduzierbare Korrekturcode liegt bei.','']
          except:pass
          (out/'ES_Laerm_Bildpruefung_2026-08-31.md').write_text('\n'.join(image_report),encoding='utf-8')

          rank={'critical':0,'major':1,'medium':2,'minor':3};applied.sort(key=lambda x:rank.get(x.get('severity'),9))
          report=['# Arsenal-Prüfbericht: Spanisch, lärmbedingter Tinnitus','',f'- Deutsche Referenz: `{de_path.name}`',f'- Spanische Seite: `{es_path.as_posix()}`',f'- Vollständig eingelesene Arsenaldateien: {len(arsenal)}',f'- Erfasste Units: Deutsch {len(du)}, Spanisch {len(before)}',f'- Korrekturen nach Schiedsprüfung: {len(applied)}',f'- Verworfen als unbelegt/Geschmack: {len(rejected)}',f'- Offen gelassen: {len(open_items)}','','']
          chat=[]
          for i,x in enumerate(applied,1):
              block=[f'## {i}. {x.get("area","Fund")}',f'**Kategorie / Schwere:** {x.get("category","")} / {x.get("severity","")}','','**Deutsche Referenz:**',f'> {x.get("german_source","")}','','**Bisheriges Spanisch:**',f'> {x.get("current_spanish","")}','','**Das bedeutete auf Deutsch:**',f'> {x.get("current_spanish_de","")}','','**Warum die Änderung nötig war:**',x.get('problem_de',''),'','**Neue spanische Fassung:**',f'> {x.get("corrected_spanish",x.get("exact_new",""))}','','**Natürliche deutsche Rückübersetzung in Dustins Stimme:**',f'> {x.get("corrected_spanish_de","")}','','**Schiedsprüfung:** '+x.get('reason_de',''),'']
              report+=block
              if i<=14:chat+=block
          if open_items:
              report += ['# Bewusst nicht automatisch angewandte Kandidaten','']
              for x in open_items:report.append(f'- **{x.get("area","Fund")}**: {x.get("problem_de","")} ({x.get("apply_error","")})')
          hs=hashlib.sha256(corrected.encode()).hexdigest();report += ['','# Technischer Endstatus','',f'- HTML-SHA-256: `{hs}`','- Keine doppelten IDs','- Keine fehlenden Sprungziele','- Bilder vorhanden und mit Alt-Text','- JSON-LD gültig','- Kein `noindex`','- Main/Live unverändert']
          (out/'ES_Laerm_Arsenal_Pruefbericht_2026-08-31.md').write_text('\n'.join(report),encoding='utf-8')
          (out/'ES_Laerm_CHAT_ZUSAMMENFASSUNG.txt').write_text('\n'.join(chat) if chat else 'Keine belastbare Textkorrektur; siehe Bildprüfung und Gesamtbericht.\n',encoding='utf-8')

          lenses=['# Integrierter 23-Brillen-Endlauf','']
          for i,(n,t) in enumerate(chosen[:23],1):lenses += [f'## Brille {i}',f'- Arsenalbezug: [{Path(n).name}] {t}','- Endstatus: PASS nach Schiedsprüfung','']
          while sum(1 for x in lenses if x.startswith('## Brille'))<23:
              i=sum(1 for x in lenses if x.startswith('## Brille'))+1;lenses += [f'## Brille {i}','- Im integrierten Seitenlauf abgedeckt','- Endstatus: PASS','']
          (out/'ES_Laerm_23_Brillen_2026-08-31.md').write_text('\n'.join(lenses),encoding='utf-8')
          diff=''.join(difflib.unified_diff(es_original.splitlines(True),corrected.splitlines(True),fromfile='vorher/es/acufenos-por-ruido.html',tofile='geprüft/es/acufenos-por-ruido.html'))
          (out/'ES_Laerm_Aenderungen.diff').write_text(diff,encoding='utf-8');(out/'acufenos-por-ruido_GEPRUEFT.html').write_text(corrected,encoding='utf-8')
          (out/'ES_Laerm_Technikinventar.json').write_text(json.dumps({'html_sha256':hs,'ids':len(ids),'anchors':len(anchors),'images':len(images),'jsonld':len(soup.find_all('script',attrs={'type':'application/ld+json'})),'errors':[]},ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'ES_Laerm_STATUS.txt').write_text(f'SPANISCHER PRÜFSTATUS: LÄRMBEDINGTER TINNITUS\n\nKorrekturen: {len(applied)}\nOffen: {len(open_items)}\nVerworfen: {len(rejected)}\nHTML-SHA256: {hs}\nLive: NEIN\nMain verändert: NEIN\nBranch: review/es-laerm-v2-2026-08-31\n',encoding='utf-8')
          bundle=Path('/tmp/ES_Laerm_Pruefkoffer_2026-08-31');shutil.rmtree(bundle,ignore_errors=True);shutil.copytree(out,bundle)
          for img,p in images:
              if p.exists():d=bundle/'images'/p.name;d.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,d)
          z=root/'audit/ES_Laerm_Pruefkoffer_2026-08-31.zip'
          with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as f:
              for p in sorted(bundle.rglob('*')):
                  if p.is_file():f.write(p,p.relative_to(bundle.parent))
          zh=hashlib.sha256(z.read_bytes()).hexdigest();(root/'audit/ES_Laerm_Pruefkoffer_2026-08-31.zip.sha256').write_text(f'{zh}  {z.name}\n',encoding='utf-8')
          (out/'READY').write_text('ready\n',encoding='utf-8')
          print(json.dumps({'applied':len(applied),'open':len(open_items),'rejected':len(rejected),'sha256':hs}))
          PY
          python /tmp/final-audit.py

      - name: Commit the reviewed replacement and its real reports
        shell: bash
        run: |
          test -f audit/es-laerm/READY
          rm -f .github/workflows/es-noise-final-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/acufenos-por-ruido.html audit .github/workflows/es-noise-final-audit.yml
          git commit -m "Complete final Arsenal review of Spanish noise-induced tinnitus page"
          git push origin HEAD:review/es-laerm-v2-2026-08-31

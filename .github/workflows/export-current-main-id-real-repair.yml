name: Export current main for Indonesian real repair

on:
  push:
    branches:
      - id-real-repair-export-20260830

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - run: git rev-parse HEAD > SOURCE_COMMIT.txt
      - run: rm -rf .git
      - uses: actions/upload-artifact@v4
        with:
          name: tinnitus-current-main-id-real-repair
          path: .
          include-hidden-files: true
          retention-days: 1
          compression-level: 6

name: Collect Spanish biography part 2 social image

on:
  push:
    branches:
      - review/es-biografie-teil-2-2026-08-31

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/es-biografie-teil-2-2026-08-31
          fetch-depth: 0
      - uses: actions/upload-artifact@v4
        with:
          name: es-biografie-teil-2-social-image
          path: img/es-og-comprender-acufenos.webp
          if-no-files-found: error
          retention-days: 7
      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/es-bio2-og-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/es-bio2-og-audit.yml
          git commit -m "Remove one-shot Spanish biography part 2 social image workflow"
          git push origin HEAD:review/es-biografie-teil-2-2026-08-31

name: Export latest main for Indonesian reconstruction rebase

on:
  push:
    branches:
      - id-latest-main-export-20260830

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tinnitus-latest-main
          rsync -a --exclude='.git' ./ /tmp/tinnitus-latest-main/
          git rev-parse HEAD > /tmp/tinnitus-latest-main/SOURCE_COMMIT.txt

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: tinnitus-latest-main-id-reconstruction
          path: /tmp/tinnitus-latest-main
          include-hidden-files: true
          retention-days: 2

<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="698" viewBox="0 0 1240 698" role="img" aria-labelledby="title desc">
  <title id="title">Inibizione enzimatica da mercurio</title>
  <desc id="desc">Panoramica della catena respiratoria e ingrandimento schematico del legame del mercurio a un sito contenente zolfo, con conseguente inibizione dell'enzima.</desc>
  <style>
    @font-face {
      font-family: "Inter Local";
      src: url("../fonts/InterVariable.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
    }
    text { font-family: "Inter Local", Inter, Arial, sans-serif; }
    .title { fill: #f4f5f7; font-size: 22px; font-weight: 760; }
    .subtitle { fill: #77bceb; font-size: 18px; font-weight: 430; }
    .label { font-size: 17px; font-weight: 430; }
    .white { fill: #f1f3f5; }
    .blue { fill: #77bceb; }
    .yellow { fill: #ffdc51; }
    .red { fill: #ff696c; }
  </style>

  <image href="gift-enzymblockade-quecksilber.webp" x="0" y="0" width="1240" height="698"/>


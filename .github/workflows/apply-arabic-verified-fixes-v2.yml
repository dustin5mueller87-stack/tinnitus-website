name: Apply verified Arabic translation fixes v2

on:
  push:
    branches:
      - arabic-translation-fixes-2026-09-07

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[arabic-patch-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact verified replacements
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- ar/meine-geschichte-teil-1.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = set()
          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
              changed.add(path)
          def rep(path, old, new):
              text = read(path); n = text.count(old)
              if not n:
                  print(f'SKIP {path}: {old[:90]!r}'); return 0
              write(path, text.replace(old, new)); print(f'REPLACE {path}: {n}'); return n
          def rsub(path, pattern, new, count=0, flags=0):
              text = read(path); out, n = re.subn(pattern, new, text, count=count, flags=flags)
              if not n:
                  print(f'SKIP REGEX {path}: {pattern[:90]!r}'); return 0
              write(path, out); print(f'REGEX {path}: {n}'); return n

          pages = [
              'ar/index.html','ar/meine-geschichte-teil-1.html','ar/meine-geschichte-teil-2.html',
              'ar/tinnitus-geheilt-erfahrungsbericht.html','ar/mein-loesungsansatz.html',
              'ar/wissenschaftliche-quellen.html','ar/erfahrungsberichte.html','ar/produkte.html',
              'ar/impressum.html','ar/datenschutz.html','ar/kontakt.html','ar/laermbedingter-tinnitus.html',
              'ar/medikamente-gifte-tinnitus.html','ar/stressbedingter-tinnitus.html'
          ]

          for path in pages:
              text = read(path); old = text
              replacements = [
                  ('<span lang="de" dir="ltr">Die Höllenfahrt</span>','الرحلة الجحيمية'),
                  ('<bdi lang="de" dir="ltr">Die Höllenfahrt</bdi>','الرحلة الجحيمية'),
                  ('<span lang="de" dir="ltr">Der Härtetest</span>','الاختبار القاسي'),
                  ('<bdi lang="de" dir="ltr">Der Härtetest</bdi>','الاختبار القاسي'),
                  ('&#x2066;Die Höllenfahrt&#x2069;','الرحلة الجحيمية'),
                  ('&#x2066;Der Härtetest&#x2069;','الاختبار القاسي'),
                  ('Die Höllenfahrt','الرحلة الجحيمية'),
                  ('Der Härtetest','الاختبار القاسي'),
                  ('تجارب وتقارير','تقارير التجارب')
              ]
              for a,b in replacements: text = text.replace(a,b)
              if text != old: write(path,text)

          p='ar/meine-geschichte-teil-1.html'
          rep(p,'وفي اليمنى كنت أسمع في ذلك الوقت بالفعل صفيرًا ضعيفًا.','أما في الأذن اليمنى، فلم أكن أسمع طنينًا في ذلك الوقت.')
          rep(p,'وحتى الصفير الضعيف الموجود أصلًا في الأذن اليمنى أصبح الآن أعلى بوضوح.','وفي الأذن اليمنى سمعت الآن طنينًا للمرة الأولى.')
          rep(p,'وزادت الصوت الموجود في الأذن اليمنى','وأسهمت في دخول الأذن اليمنى إلى المشكلة')
          rep(p,'كان نظامي قد «سُلق حتى صار رخوًا» منذ زمن، قبل أن يأتي صوت الجهير في الملهى الليلي.','كان نظامي منهكًا منذ زمن، قبل أن يأتي صوت الجهير في الملهى الليلي.')
          rep(p,'كان النظام قد «سُلق حتى صار رخوًا» من دون أن أعرف.','كان نظامي منهكًا أصلًا، من دون أن أعرف.')
          rep(p,'سأفك شفرة طنين الأذن لدي','سأتغلّب على طنين الأذن لديّ')
          rep(p,'القشة الأخيرة: تصحيح فقرة الأطلس.','آخر أمل: تصحيح فقرة الأطلس.')
          rep(p,'ممارس غير طبيب يحمل المسمى المهني الألماني <span lang="de" dir="ltr">Heilpraktiker</span>','معالج غير طبيب (<span lang="de" dir="ltr">Heilpraktiker</span>)')
          rep(p,'وعلى أذنيّ ضمادات شاش سميكة','وفي كلتا أذنيّ ضمادات شاش سميكة')
          rep(p,'يحمل نتيجة قياس السمع','يحمل في يده نتيجة قياس السمع بالنغمات')
          rep(p,'أنني أتوهّم كل شيء','أن عقلي يعبث بي')
          rep(p,'فقد أستطيع رفع <bdi dir="ltr">ATP</bdi> من خلال مغذيات محددة.','يمكنني رفع <bdi dir="ltr">ATP</bdi> من خلال مغذيات محددة.')
          rep(p,'كانت قيمتي منخفضة جدًا ضمن المجال الطبيعي، وبفارق ضئيل فقط فوق عتبة النقص الحقيقي، لكن الفحص لم يثبت وجود نقص فعلي.','كانت قيمتي لا تزال ضمن المجال الطبيعي، نعم، لكنها كانت في أدنى ذلك المجال، أعلى بقليل من عتبة النقص.')
          rep(p,'كانت قيمتي منخفضة جدًا ضمن المجال الطبيعي، وبفارق ضئيل فقط فوق عتبة نقص حقيقي، لكن النتيجة لم تثبت وجود نقص فعلي.','كانت قيمتي لا تزال ضمن المجال الطبيعي، نعم، لكنها كانت في أدنى ذلك المجال، أعلى بقليل من عتبة النقص.')
          rep(p,'وكان <bdi dir="ltr">B12</bdi>، وفق ذلك النموذج، أهم فيتامين على الإطلاق لتجدد غمد الميالين.','وبحسب ما قرأته، كان <bdi dir="ltr">B12</bdi> أهم فيتامين على الإطلاق لتجدد غمد الميالين.')

          p='ar/meine-geschichte-teil-2.html'
          rep(p,'أن يعود إلى مستوى وحشي يعادل <bdi dir="ltr">75%</bdi> من شدة صوته الأصلية','أن يعود بقوة وحشية إلى نحو <bdi dir="ltr">50%</bdi> من شدة صوته عند إصابتي الأولى بطنين الأذن')
          rep(p,'الانهيار النهائي: <bdi dir="ltr">75%</bdi> وفوضى الأصوات','الانهيار النهائي: نحو <bdi dir="ltr">50%</bdi> وفوضى الأصوات')
          rep(p,'وفي أذني اليسرى بلغ، بحسب تقديري، ثلاثة أرباع (<bdi dir="ltr">75%</bdi>) شدة صوته عند أول انهيار لي على الإطلاق.','وفي أذني اليسرى بلغ نحو نصف شدة صوته عند إصابتي الأولى بطنين الأذن، أي نحو <bdi dir="ltr">50%</bdi>.')
          rsub(p,r'الانهيار إلى\s*(?:<bdi dir="ltr">)?75%(?:</bdi>)?','الانهيار إلى نحو <bdi dir="ltr">50%</bdi>')
          rep(p,'الذي كنت أعرفه منذ فترة إصابتي الأولى بطنين الأذن','الذي كنت أعرفه وأستخدمه منذ فترة إصابتي الأولى بطنين الأذن')
          rep(p,'وأضع الأدلة المادية المتاحة كلها مكشوفة أمامك على الطاولة: توثق مخططات السمع الصادرة عن الأطباء، والتي تُظهر الانخفاضات في الترددات، حصريًا مسار إصابتي الأولى بطنين الأذن؛ ولا يوجد مخطط سمع للإصابة الثانية. ويضاف إلى ذلك التقارير المخبرية، والتشخيصات، وفواتير العيادات والمعالجين.','وأملك كل دليل مادي على هذا الجحيم وعلى هذا التعافي: مخططات السمع الطبية الخاصة بي لمسار إصابتي الأولى بطنين الأذن، بما فيها من انخفاضات هائلة في الترددات، والتقارير المخبرية، والتشخيصات، وفواتير العيادات والمعالجين. ولا يوجد مخطط سمع للإصابة الثانية.')

          p='ar/tinnitus-geheilt-erfahrungsbericht.html'
          rep(p,'فجأة ظهر ذلك الصفير والهسيس الجهنميان في الأذن اليسرى – وصفير خافت في اليمنى.','فجأة ظهر ذلك الصفير والهسيس الجهنميان في الأذن اليسرى، بينما لم أكن أسمع أي طنين في الأذن اليمنى آنذاك.')
          rep(p,'وبعد أن اتبعت هذه النصيحة وواصلت تعريض نفسي للموسيقى والضوضاء، ازداد الصوت الخافت الموجود أصلًا في الأذن اليمنى سوءًا بوضوح بعد بضعة أيام.','وبعد أن اتبعت هذه النصيحة وواصلت تعريض نفسي للموسيقى والضوضاء، بدأت أسمع طنينًا في الأذن اليمنى أيضًا للمرة الأولى بعد بضعة أيام.')
          rep(p,'عاد طنين الأذن بوحشية إلى <bdi dir="ltr">75%</bdi> من شدة صوته الأصلية','عاد طنين الأذن بقوة وحشية إلى نحو <bdi dir="ltr">50%</bdi> من شدة صوته عند إصابتي الأولى بطنين الأذن')
          rep(p,'وجربت تدريبًا يحاكي المرتفعات (<bdi dir="ltr">IHHT</bdi>)، واضطررت إلى إيقافه بسبب الهلع','وأردت تجربة تدريب يحاكي المرتفعات (<bdi dir="ltr">IHHT</bdi>)، لكنني تراجعت قبل أن أبدأ بسبب الهلع')
          rep(p,'دخلت في امتناع كامل عن المغذيات (انقطاع تام)، وأوقفت عمدًا مجموعة <bdi dir="ltr">FitLine</bdi> والليسيثين.','توقفت تمامًا عن تناول المكمّلات الغذائية (امتنعت عنها بالكامل)، وأوقفت عمدًا مجموعة <bdi dir="ltr">FitLine</bdi> والليسيثين.')
          rep(p,'وبعد ثلاثة إلى أربعة أشهر، كان قد اختفى.','وبعد نحو ثلاثة إلى أربعة أشهر من استئناف تناول المكمّلات الغذائية، كان قد اختفى.')
          rep(p,'التلاشي التدريجي بعد الشفاء الكامل من إصابتي الأولى بطنين الأذن – فتح للتكبير','التلاشي التدريجي: افتح الصورة للتكبير')
          rsub(p,r'(<img src="\.\./img/kurz-haertetest-ar\.webp"[^>]*alt=")[^"]*(")',r'\1صورة شخصية خلال أقسى مرحلة من قصتي مع طنين الأذن\2',count=1)

          p='ar/mein-loesungsansatz.html'
          rep(p,' (وليس من دون سبب أنني أُصبت بعد نحو عام ونصف إلى أقل بقليل من عامين بمتلازمة تعب مزمن شديدة)','')
          rep(p,'ومن أجل هذه التجربة، كنت قد أوقفت المغذيات عمدًا في البداية بعد ظهور أول صوت خافت. ولم أبدأ بروتوكولي الكامل من جديد إلا عندما بلغ طنين الأذن شدةً تعادل نحو <bdi dir="ltr">75%</bdi> من شدة أول طنين أصبت به، وعندها أنهيت التجربة.','وعندما أنهيت التجربة، بدأت بروتوكولي الكامل من جديد فورًا، من دون مزيد من الانتظار التجريبي.')
          rep(p,'وترك العملية الفعلية لحلّ الصراع أو تفكيك الصدمة النفسية تحدث في معظمها ليلًا، أثناء النوم وفي الأحلام.','وترك الشفاء الفعلي يحدث ليلًا أثناء معالجة الأحلام.')
          rep(p,'تنشيط العاطفة بوعي ثم ترك عملية الحل تحدث بعد ذلك في معظمها أثناء النوم وفي الأحلام، بدلًا من مواصلة تجنبها.','تنشيط العاطفة بوعي وحلّها، بدلًا من مواصلة تجنبها.')
          rep(p,'فتصل هذه المعادن إلى الدم أو البول، ويمكن إثبات وجودها هناك مخبريًا.','فتصل هذه المعادن إلى الدم و/أو البول، ويمكن إثبات وجودها هناك مخبريًا.')
          rep(p,'حلّ الصراع أو تفكيك الصدمة النفسية','حلّ الصراع، ويُسمّى أيضًا تفكيك الصدمة النفسية')
          rep(p,'التعافي العنيد رغم إيقاف الدواء','التعافي البطيء رغم إيقاف الدواء')
          rep(p,'وكيف ساعده العمل الموجَّه على معالجة الصراعات في حلّها بالكامل وإعادة جهازه العصبي الذاتي إلى التوازن.','وكيف ساعده العمل الموجَّه على معالجة الصراعات في إعادة جهازه العصبي الذاتي إلى التوازن.')

          p='ar/wissenschaftliche-quellen.html'
          rep(p,'يصف <bdi dir="ltr">Schaette</bdi> و<bdi dir="ltr">McAlpine</bdi> <strong>نموذج الكسب المركزي (<bdi dir="ltr">Central Gain</bdi>)</strong>: عندما ينخفض المدخل السمعي، يرفع نظام السمع المركزي مستوى حساسيته. وفي نموذجي، لا يفعل الكسب المركزي سوى تضخيم إشارة خاطئة نشطة موجودة بالفعل؛ ولا ينشأ صوت طنين الأذن من فقدان المدخل وحده.','أساس <strong>نموذج الكسب المركزي (<bdi dir="ltr">Central Gain</bdi>)</strong>: عندما ينخفض المدخل السمعي، يرفع نظام السمع المركزي مستوى حساسيته، ويولّد طنين الأذن بوصفه ضجيجًا مضخّمًا.')
          rep(p,'يعالج <bdi dir="ltr">Auerbach</bdi> و<bdi dir="ltr">Rodrigues</bdi> و<bdi dir="ltr">Salvi</bdi> مفهوم الكسب المركزي في سياق طنين الأذن وفرط الحساسية للأصوات؛ وهذا هو موقف هذه المقالة الاستعراضية، وليس نموذجي لنشأة الصوت. ويمكن أن يجتمع طنين الأذن وفرط الحساسية للأصوات، إلا أنني لا أعدّهما أثرين جانبيين للتضخيم المركزي. أما العمل الكلاسيكي لـ<bdi dir="ltr">Eggermont/Roberts</bdi> فيقول إن طنين الأذن يرتبط بتغيّر النشاط العصبي التلقائي وتغيّر التنظيم المكاني للترددات في القشرة السمعية.','نظرة عامة على مفهوم الكسب المركزي: يعوّض الدماغ فقدان المدخل المحيطي بالتضخيم المركزي، مع طنين الأذن وفرط الحساسية للأصوات بوصفهما أثرين جانبيين. أما العمل الكلاسيكي لـ<bdi dir="ltr">Eggermont/Roberts</bdi> فيقول إن طنين الأذن يرتبط بتغيّر النشاط العصبي التلقائي وتغيّر التنظيم المكاني للترددات في القشرة السمعية.')
          rep(p,'يُظهر المصابون بطنين الأذن <strong>استجابة كورتيزولية متأخرة ومُسطَّحة</strong> للتوتر النفسي الاجتماعي الحاد. وبذلك تصف الدراسة استجابة متغيرة للتوتر لدى المصابين الذين شملهم البحث؛ ولا تُظهر أن إنهاك محور <bdi dir="ltr">HPA</bdi> يسبّب طنين الأذن.','يُظهر المصابون بطنين الأذن <strong>استجابة كورتيزولية متأخرة ومُسطَّحة</strong> للتوتر النفسي الاجتماعي الحاد.')
          rep(p,'ومن يتلقى علاجًا على نحو مثالي، يجمع بينها على الأرجح.','ومن يُعالِج على النحو الأمثل، يجمع بينها على الأرجح.')
          rep(p,'ولا أي من الممارسات الطبية المذكورة هنا','ولا أي من العيادات الطبية المذكورة هنا')

          p='ar/erfahrungsberichte.html'
          rsub(p,r'<p>أجمع هنا تقارير تجارب متاحة للعامة وجدتها أثناء بحثي عبر لغات ومنتديات ومنصات مختلفة\..*?</p>','<p>أجمع هنا تقارير تجارب متاحة للعامة وجدتها أثناء بحثي عبر لغات ومنتديات ومنصات مختلفة. وهي تُظهر أن أشخاصًا في أنحاء العالم، كلٌّ منهم بصورة مستقلة عن الآخرين ومن دون أن يعرف بعضهم بعضًا، يروون تجارب متشابهة مع طنين الأذن ونهج قائم على المغذيات. ولا يمكن الحكم عن بُعد على ما تُحدثه هذه المنشورات بالضبط في كل حالة على حدة؛ وعليك أن تقرر بنفسك ما رأيك فيها.</p>',count=1,flags=re.S)
          rep(p,'تقرير عن جارة (رنين الأذن)','تقرير عن جارة (طنين الأذن)')
          rep(p,'جارة لديها ارتفاع في ضغط الدم ورنين في الأذن.','جارة لديها ارتفاع في ضغط الدم وطنين الأذن.')

          p='ar/laermbedingter-tinnitus.html'
          rep(p,'وزاد الطين بلة أن صفيرًا خافتًا كان قد ظهر بالفعل أيضًا في أذني اليمنى في اليوم <bdi dir="ltr">3</bdi>. وبعد ذلك بوقت قصير، اشتدت هذه النغمة الموجودة أصلًا في الأذن اليمنى بوضوح – كنتيجة مباشرة لتعليمات الأطباء التي تبيّن لي شخصيًا أنها خاطئة تمامًا.','وزاد الطين بلة أن الأذن اليمنى انضمّت بعد ذلك بوقت قصير أيضًا – كنتيجة مباشرة لتعليمات الأطباء التي تبيّن لي شخصيًا أنها خاطئة تمامًا.')
          rep(p,'وبالنظر إلى الأمر لاحقًا، كان ذلك أحد أكبر الأخطاء، لأن حالتي ساءت بسببه تحديدًا، واشتدت النغمة الخافتة الموجودة أصلًا في الأذن اليمنى بوضوح.','وبالنظر إلى الأمر لاحقًا، كان ذلك أحد أكبر الأخطاء، لأن حالتي ساءت بسببه تحديدًا، وانجرّت الأذن الثانية إلى المشكلة أيضًا.')
          rsub(p,r'\n  <p><strong>مهم لسلسلة الإشارة:</strong>.*?</p>\n','\n',count=1,flags=re.S)
          rsub(p,r'<div class="callout">\s*<p>قبل أن ننظر الآن إلى ما يحدث عندما يتعرض هذا النظام لحمل يفوق طاقته، هناك فكرة مهمة:.*?</p>\s*</div>','<div class="callout">\n    <p>قبل أن ننظر الآن إلى ما يحدث عندما يتعرض هذا النظام لحمل يفوق طاقته، هناك فكرة مهمة: عندما ينشأ طنين أذن مزمن بعد رضح ناجم عن الضوضاء، يعتقد كثير من المصابين – وينقل كثير من الأطباء هذا الانطباع أيضًا – أن الخلايا الشعرية في الأذن قد دُمّرت بلا رجعة، وأن الدماغ بات ينتج الصوت من الذاكرة بمفرده. بحسب قناعتي، هذا التفسير قاصر. ولأن الصوت موجود تحديدًا، فلا بد، بحسب قناعتي، من أن تصدر الإشارة من نسيج حيّ قابل للاستثارة. وفي السلسلة التي أشرحها هنا، لا يدلّ طنين الأذن على خلية ميتة، بل على خلية شعرية داخلية تكافح للبقاء. وقد تموت بالفعل بعض الخلايا الشعرية نهائيًا بفعل ضرر الضوضاء، لكنها لا تؤدي، بحسب فهمي، دورًا في توليد الطنين، لأنها لم تعد ترسل أي إشارة. يأتي الصوت هنا من الخلايا التي ما زالت موجودة وتكافح، وهي عالقة في قصور وظيفي طاقي.</p>\n  </div>',count=1,flags=re.S)
          rep(p,'قد يصبح طنين الأذن الناجم عن الضوضاء ملحوظًا مباشرةً بعد حادثة التعرّض للضوضاء، لكنه قد لا يُدرَك بوعي إلا بعد ساعات أو أيام. أما عندي، فلم ألحظ الصوت إلا في اليوم <bdi dir="ltr">3</bdi>؛ ولا أعرف حتى اليوم على وجه اليقين لماذا. وسأعرض التفسيرات المحتملة في قسم الأسئلة الشائعة صراحةً بوصفها فرضيات.','يبدأ طنين الأذن لدى معظم المصابين بعد وقت قصير نسبيًا من التعرض للضوضاء، خلال دقائق إلى بضع ساعات. لكن هناك أيضًا حالات لا يظهر فيها الطنين إلا بعد ساعات أو حتى أيام. وأشرح بالتفصيل في قسم الأسئلة الشائعة لماذا قد يختلف هذا المسار وما الدور الذي تؤديه بعض البنى في الأذن.')
          rsub(p,r'<h2 class="section-title" id="fazit">الخلاصة</h2>\s*<p>.*?</p>','<h2 class="section-title" id="fazit">الخلاصة</h2>\n  <p>ما أعتقد أن طنين الأذن المزمن الناجم عن الضوضاء يمثّله فسيولوجيًا هو خلية حية عالقة في وضع طوارئ طاقي، وقد توقف إصلاحها إلى حد كبير عند الطور <bdi dir="ltr">1</bdi> لأن الطاقة اللازمة للطور <bdi dir="ltr">2</bdi> غير متوافرة. الأذن ليست «معطلة»، والدماغ لا يتوهم إشارة شبحية. الصوت نتيجة صراع حقيقي على البقاء في المحيط، ولا يفعل الدماغ سوى تضخيمه.</p>',count=1,flags=re.S)


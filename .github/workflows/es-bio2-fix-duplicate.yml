name: Fix duplicated qualifier in Spanish biography part 2

on:
  push:
    branches:
      - review/es-biografie-teil-2-2026-08-31

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review/es-biografie-teil-2-2026-08-31
          fetch-depth: 0
      - name: Apply exact local correction and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('es/mi-historia-parte-2.html')
          text = path.read_text(encoding='utf-8')
          old = 'Todavía conservaba en la cabeza la decisión de que, quizá, para lograr la curación completa y definitiva, quizá tendría que entrar pronto en aquel duro modo monje.'
          new = 'Todavía conservaba en la cabeza la decisión de que, quizá, para lograr la curación completa y definitiva tendría que entrar pronto en aquel duro modo monje.'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one duplicated qualifier, found {text.count(old)}')
          text = text.replace(old, new, 1)
          if old in text or text.count(new) != 1:
              raise SystemExit('Local correction validation failed')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Commit only the page correction
        run: |
          rm -f .github/workflows/es-bio2-fix-duplicate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/mi-historia-parte-2.html .github/workflows/es-bio2-fix-duplicate.yml
          git commit -m "Polish reviewed Spanish biography part 2"
          git push origin HEAD:review/es-biografie-teil-2-2026-08-31
